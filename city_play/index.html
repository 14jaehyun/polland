<style>

  font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}

#c{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);display:block;height:100%;width:auto;max-width:100%;aspect-ratio:1179/2556;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
@media (max-aspect-ratio:3/4){#c{left:0;transform:none;width:100%;aspect-ratio:auto;box-shadow:none}}
html,body{background:#05060c}

<div class="ov" id="start">
  <h1>장대 위에서<br><b>버티기</b></h1>
  <p>폰을 쟁반처럼 들고, 천천히 기울여 휘청이는 장대의 균형을 잡고, 날아오는 방해물은 눌러서 터뜨리세요. 기울인 쪽(화면 기준)으로 장대가 휘어요. 시작할 때 폰 각도가 수평 기준이 됩니다.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function START(CD){
const TOP=320;               // 장대 높이 (도시 시안과 같은 단위, 화면 표시 320m)
const LIMIT_DEG=CD.limitDeg||10, LIMIT=Math.tan(LIMIT_DEG*Math.PI/180)*320/25.6;   // 떨어지는 각도 (도시별, 기본 10° = 2.2)
// 쓰러지려는 힘: 10°(2.2)까지는 예전 그대로, 그 너머는 아주 완만하게만 늘어서 한도를 넓힌 도시도 어느 각도든 원복 가능
function fallF(x){const a=Math.abs(x);return Math.sign(x)*(a<=2.2?a*(1+.12*a*a):3.4848+.2*(a-2.2));}
const $=id=>document.getElementById(id);

// ---------- 렌더러 / 씬 ----------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
let PR=Math.min(devicePixelRatio,2); renderer.setPixelRatio(PR);
// 폰이 버거워하면(2초 평균 40fps 미만) 해상도를 한 단계씩 낮춤
let pfT=0,pfN=0;
function perf(dt){ pfT+=dt;pfN++; if(pfT>2){ const fps=pfN/pfT; pfT=0;pfN=0; if(fps<40&&PR>1){ PR=Math.max(1,PR-.25); renderer.setPixelRatio(PR); resize(); } } }
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x18224a);
scene.fog=null;
const camera=new THREE.PerspectiveCamera(74,1024/1536,.3,3000);
const camPos=new THREE.Vector3();
// 그림을 뽑을 때 쓴 카메라(대각선 56°·28°) 그대로. 그림은 크롭 전 2:3, 화면은 그 가운데 75% 높이를 잘라 씀
const D=Math.PI/180, RW=1024, RH=1536, CROP=.75, TX=625, TY=1042, FOLLOW=1;
const UP=new THREE.Vector3(0,1,0), UPP=new THREE.Vector3(...CD.up).normalize(), qP=new THREE.Quaternion().setFromUnitVectors(UPP,UP);
const T0=new THREE.Vector3(0,TOP,0);
const pc=new THREE.PerspectiveCamera(74,1179/2556,.3,3000);
pc.rotation.order='YXZ'; pc.rotation.set(-56*D,-28*D,0); pc.updateMatrixWorld(true);
{const d0=new THREE.Vector3(1/3,-1/3,.5).unproject(pc).normalize(); pc.position.set(-d0.x*20,TOP+1-d0.y*20,-d0.z*20); pc.aspect=RW/RH; pc.updateProjectionMatrix(); pc.updateMatrixWorld(true);}
const camQuat=qP.clone().multiply(pc.quaternion);
const camOffset=pc.position.clone().sub(T0).applyQuaternion(qP).sub(new THREE.Vector3(0,.3,0));   // 꼭대기(받침 위) 기준
const scrR=new THREE.Vector3(1,0,0).applyQuaternion(camQuat); scrR.y=0; scrR.normalize();
const scrD=new THREE.Vector3(0,-1,0).applyQuaternion(camQuat); scrD.y=0; scrD.normalize();
const cv={dist:20};
let view='2';
let ZOOM=true; const ZK=.7, PIVY=.86;   // 축(화면 높이 86%)이 화면 아래 바로 바깥으로 가도록 위쪽 70%만 확대해서 보여줌
function applyView(){
  const h=innerHeight,w=innerWidth/innerHeight<.75?innerWidth:Math.round(h*1179/2556);   // 폰(세로 화면)은 꽉 채우고, 넓은 화면에선 폰 비율 틀로
  let CH=RH*CROP, CW=CH*w/h; if(CW>RW*.95){CW=RW*.95;CH=CW*h/w;}
  const x0=Math.min(Math.max(TX-CW*2/3,-RW*.1),RW*1.1-CW), y0=Math.min(Math.max(TY-CH*2/3,-RH*.1),RH*1.1-CH);
  camera.fov=74; camera.aspect=RW/RH; if(ZOOM){camera.setViewOffset(RW,RH,x0+CW*(2/3)*(1-ZK),y0+CH*(PIVY-.02-ZK),CW*ZK,CH*ZK);}else camera.setViewOffset(RW,RH,x0,y0,CW,CH); camera.updateProjectionMatrix();
}
applyView();


// ---------- 도시: 생성 그림을 깊이대로 띄운 판 ----------
// 판은 제자리에서 화면 안의 한 점(장대가 땅에 닿아 보이는 곳 PV)을 축으로 회전만 함
const PG=new THREE.Group(), PGi=new THREE.Group(); PG.add(PGi); scene.add(PG); let reliefMesh=null, poleM=null; const PV=new THREE.Vector3();
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
{
  const [CU0,CUW,CV0,CVH]=CD.frame;   // 이 그림이 기준 틀에서 차지하는 부분
  const G={nx:CD.nx,ny:CD.ny}, VD=new Float32Array(Uint8Array.from(atob(CD.vd),c=>c.charCodeAt(0)).buffer);
  const img=new Image(); const tex=new THREE.Texture(img); img.onload=()=>{tex.needsUpdate=true;}; img.src=CD.img;
  tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  // 그림 가장자리 바깥으로 15%씩 더 늘려서(끝 픽셀을 그대로 늘림) 흔들려도 빈 곳이 안 보이게
  const ex=Math.round((G.nx-1)*.3),ey=Math.round((G.ny-1)*.3),nx=G.nx+2*ex,ny=G.ny+2*ey,pos=new Float32Array(nx*ny*3),uv=new Float32Array(nx*ny*2),tv=Math.tan(74*Math.PI/360),asp=RW/RH,v3=new THREE.Vector3();
  const cl=(a,lo,hi)=>a<lo?lo:a>hi?hi:a;
  const mr=(k,n)=>{k=k<0?-k:k;return k>n-1?Math.max(0,2*(n-1)-k):k;};   // 그림 밖은 거울처럼 접어서 이어 붙임
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const k=j*nx+i,u=(i-ex)/(G.nx-1),v=(j-ey)/(G.ny-1),mi=mr(i-ex,G.nx),mj=mr(j-ey,G.ny),d=VD[mj*G.nx+mi];
    const bu=CU0+u*CUW,bv=CV0+v*CVH;v3.set((bu*2-1)*asp*tv*d,(1-bv*2)*tv*d,-d).applyMatrix4(pc.matrixWorld);pos[k*3]=v3.x;pos[k*3+1]=v3.y;pos[k*3+2]=v3.z;uv[k*2]=mi/(G.nx-1);uv[k*2+1]=1-mj/(G.ny-1);}
  const idx=[];for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=j*nx+i,b=a+1,c=a+nx,d=c+1;idx.push(a,c,b,b,c,d);}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));geo.setIndex(idx);
  // 그림 속 세상은 위 방향이 살짝 기울어 있어서, 장대 꼭대기를 축으로 돌려 우리 장면의 위와 맞춤
  const paintG=new THREE.Group(); paintG.quaternion.copy(qP); paintG.position.copy(T0).sub(T0.clone().applyQuaternion(qP)); PGi.add(paintG);
  reliefMesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,fog:false})); paintG.add(reliefMesh);
}


// 장대: 휘지 않는 파란 낡은 콘크리트 원기둥, 밑동을 축으로 통째로 기울어짐
function concreteTex(){
  const R=rng(4242), c=document.createElement('canvas'); c.width=256; c.height=512;
  const g=c.getContext('2d'), w=256, h=512;
  g.fillStyle='#4467a8';g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const l=R()<.5;g.fillStyle=l?'rgba(150,180,235,'+(R()*.25)+')':'rgba(10,20,55,'+(R()*.3)+')';g.fillRect(R()*w,R()*h,1+R()*2,1+R()*2)}
  for(let i=0;i<14;i++){g.fillStyle='rgba(110,145,210,'+(0.25+R()*.3)+')';g.beginPath();g.ellipse(R()*w,R()*h,4+R()*18,3+R()*12,R()*3,0,Math.PI*2);g.fill()}
  for(let i=0;i<22;i++){g.fillStyle='rgba(8,16,44,'+(0.12+R()*.25)+')';g.fillRect(R()*w,R()*h,1+R()*4,30+R()*160)}
  g.fillStyle='rgba(6,12,36,.7)';g.fillRect(0,h-6,w,3);g.fillStyle='rgba(160,190,240,.35)';g.fillRect(0,h-3,w,2);
  g.strokeStyle='rgba(6,10,30,.75)';g.lineWidth=1.2;
  for(let i=0;i<6;i++){let x=R()*w,y=R()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k<7;k++){x+=(R()-.5)*14;y+=6+R()*14;g.lineTo(x,y)}g.stroke()}
  for(let x=0;x<w;x++){const b=.55+.45*Math.cos(2*Math.PI*(x/w-.25));g.fillStyle='rgba(4,8,26,'+((1-b)*.72)+')';g.fillRect(x,0,1,h)}
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); return t;
}
const SWAY=25.6;  // 한계에서 꼭대기가 옆으로 밀리는 거리 (높이 320 기준, 한도 10° 그대로)
const CAP=.3;   // 꼭대기 받침 두께
const poleTex=concreteTex(); poleTex.repeat.set(1,TOP/14);
const pivot=new THREE.Group(); scene.add(pivot);
const poleGeo=new THREE.CylinderGeometry(.6,1.7,TOP,28); poleGeo.translate(0,TOP/2,0);
{const pm=new THREE.Mesh(poleGeo,new THREE.MeshBasicMaterial({map:poleTex,depthTest:false}));pm.renderOrder=1;pivot.add(pm);poleM=pm;}
const capTex=poleTex.clone(); capTex.needsUpdate=true; capTex.repeat.set(1,.12);
const capM=new THREE.Mesh(new THREE.CylinderGeometry(.75,.68,CAP,28),new THREE.MeshBasicMaterial({map:capTex,color:0xbfc9e6}));
capM.position.y=TOP+CAP/2; pivot.add(capM); capM.renderOrder=2;
const top=new THREE.Vector3(0,TOP+CAP,0), tilt={x:0,z:0};
function bendPole(sx,sz){
  tilt.x=Math.atan(sx*SWAY/TOP); tilt.z=Math.atan(sz*SWAY/TOP);
  // 장대·사람·카메라는 화면에 고정 (기울기는 판의 회전으로만 보임)
}


  // ---------- 걸터앉은 사람: 키 170cm, 상면 지름 150cm 실제 비율. 등이 카메라 쪽 ----------
  // 매끈한 관절 인형 같은 덩어리감, 검정 실루엣에 은은한 빛 반사(위는 푸른 하늘빛, 아래는 거리의 주황빛)
  const ink=new THREE.MeshStandardMaterial({color:0x0a0c12,roughness:.38,metalness:.25});
  const hemi=new THREE.HemisphereLight(0x8fa6ff,0xff8a3d,.55); scene.add(hemi);
  const rim=new THREE.DirectionalLight(0xbfd0ff,.6); rim.position.set(-30,40,-60); scene.add(rim);
  const Y=new THREE.Vector3(0,1,0);
  const man=new THREE.Group(); scene.add(man);          // 장대 꼭대기를 따라가며 기울어짐
  const body=new THREE.Group(); man.add(body);            // 흔들릴 때 몸이 살짝 버팀
  const fig=new THREE.Group(); body.add(fig);
  fig.rotation.y=-28*Math.PI/180; fig.scale.setScalar(1.5); fig.translateZ(.6);   // 카메라와 같은 방향(등이 보임), 상면 100cm에 키 170cm 비율, 가운데 쪽으로
  const shadowPlate=new THREE.Mesh(new THREE.PlaneGeometry(.62,.7),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.42,depthWrite:false}));
  shadowPlate.rotation.x=-Math.PI/2; shadowPlate.position.set(0,.004,-.44); fig.add(shadowPlate);   // 사람 그림자: 단순한 검은 판   // 상면(지름 1.5)을 100cm로 보고 키 170cm 비율 → 1.5배   // 카메라와 같은 방향을 봄 → 등이 보임
  const V=a=>new THREE.Vector3(...a);
  function cap2(a,b,r1,r2){ // 양 끝이 둥근 막대 (매끈한 팔다리)
    const A=V(a),B=V(b),d=B.clone().sub(A),L=d.length();
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,L,16),ink);m.position.copy(A).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(Y,d.clone().normalize());fig.add(m);
    for(const [p,r] of [[A,r1],[B,r2]]){const j=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),ink);j.position.copy(p);fig.add(j);}
  }
  function along(geo,a,b,sx,sz){ // a→b 축을 따라 세운 덩어리
    const A=V(a),B=V(b),d=B.clone().sub(A);const m=new THREE.Mesh(geo,ink);m.position.copy(A);m.quaternion.setFromUnitVectors(Y,d.clone().normalize());m.scale.set(sx,d.length(),sz);fig.add(m);return m;}
  const lathe=pts=>new THREE.LatheGeometry(pts.map(([r,y])=>new THREE.Vector2(r,y)),24);
  // 몸통: 골반 → 허리 → 가슴 → 어깨 (높이 1로 만들고 길이에 맞춰 늘림), 살짝 웅크려 앞으로 기울임
  const PEL=[0,.13,-.4], SHO=[0,.62,-.5];
  along(lathe([[0,0],[.13,.02],[.165,.09],[.16,.2],[.13,.4],[.135,.55],[.165,.75],[.175,.86],[.15,.95],[.07,1],[0,1.01]]),PEL,SHO,1.12,.62);
  // 목·머리 (고개 숙임)

function computePivot(){

  camera.position.set(0,TOP+CAP,0).add(camOffset); camera.quaternion.copy(camQuat); camera.updateMatrixWorld(true);

  // 중심(0.5° 이내)에 맞으면 가장자리에 초록 음영 (부드럽게 들어오고 빠짐)
  const gw=state==='play'&&deg<.5?1:0;
  gz+=(gw-gz)*Math.min(1,dt*(gw>gz?10:6));
  if(gz>.005){
    const cr=$('c').getBoundingClientRect(), W=cr.width, H=cr.height, cx=cr.left+W/2, cy=cr.top+H/2;
    const gg=g2.createRadialGradient(cx,cy,Math.max(W,H)*.34,cx,cy,Math.max(W,H)*.7);
    gg.addColorStop(0,'rgba(20,200,90,0)'); gg.addColorStop(.6,'rgba(30,210,100,'+(gz*.22)+')'); gg.addColorStop(1,'rgba(10,170,70,'+(gz*.45)+')');
    g2.fillStyle=gg; g2.fillRect(cr.left,cr.top,W,H);
  }
  let w=0; if(state==='play'&&deg>5){ const u=Math.min(1,(deg-5)/(LIMIT_DEG-5)); w=.45+.55*u*u*(3-2*u); }   // 5°에서 바로 45%로 켜짐
  dz+=(w-dz)*Math.min(1,dt*(w>dz?14:4));               // 켜질 땐 즉시, 꺼질 땐 조금 천천히
  if(dz<.005) return;
  dph+=dt*(1.1+dz*1.6)*Math.PI*2;                         // 박동: 분당 약 66 → 160
  const beat=Math.pow(Math.max(0,Math.sin(dph)),6)*.6+Math.pow(Math.max(0,Math.sin(dph-.9)),8)*.3;   // 쿵-쿵
  const cr=$('c').getBoundingClientRect(), W=cr.width, H=cr.height;
  const cx=cr.left+W/2, cy=cr.top+H/2;
  const r0=Math.max(W,H)*(.36-.14*dz), r1=Math.max(W,H)*.7;
  const a=Math.min(.95,dz*(.6+beat*.4));
  const gr=g2.createRadialGradient(cx,cy,r0,cx,cy,r1);
  gr.addColorStop(0,'rgba(150,0,8,0)'); gr.addColorStop(.55,'rgba(170,4,12,'+(a*.55)+')'); gr.addColorStop(1,'rgba(110,0,6,'+a+')');
  g2.fillStyle=gr; g2.fillRect(cr.left,cr.top,W,H);
  g2.fillStyle='rgba(140,0,10,'+(dz*.16+beat*dz*.12)+')'; g2.fillRect(cr.left,cr.top,W,H);   // 화면 전체도 붉은 기
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&state==='play'){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
});
requestAnimationFrame(step);
}
