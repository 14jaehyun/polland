<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
</head><body>
<title>장대 위에서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
/* 한 화면 게임: 3D 캔버스 전체 + 위쪽 기록 + 가운데 오버레이 */
:root{
  --bg:#050507; --fg:#f4f4f6; --dim:rgba(244,244,246,.55); --faint:rgba(244,244,246,.18);
  --accent:#e0262b;
  --display:"Black Han Sans","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#time{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#pop{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:1em}
#best{font-size:12px;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(5,5,7,.55);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov h1{font-family:var(--display);font-weight:400;font-size:44px;margin:0;line-height:1.05;text-wrap:balance}
.ov h1 b{color:var(--accent);font-weight:400}
.ov p{margin:0;color:var(--dim);font-size:14px;line-height:1.6;max-width:28ch}
.big{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
button{font:inherit;font-family:var(--display);font-size:20px;color:var(--bg);background:var(--fg);border:0;
  border-radius:999px;padding:14px 44px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:active{transform:scale(.97)}
#ver{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;pointer-events:none;z-index:5}
#dir{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 18px);z-index:20;font-family:var(--body);font-size:12px;font-weight:600;color:var(--fg);background:rgba(244,244,246,.12);border:1px solid var(--faint);padding:8px 12px}
.city{display:flex;gap:0;border:1px solid var(--faint);border-radius:999px;padding:3px}
.city button{font-family:var(--body);font-size:14px;font-weight:600;background:transparent;color:var(--dim);padding:8px 22px}
.city button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#mode{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:var(--dim);pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
</style>

<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div class="hud"><div id="time">0.0</div><div id="best">최고 0.0초</div><div id="pop"></div></div>
<button id="dir" type="button"></button>
<div id="mode"></div>
<div id="ver">v0.08</div>

<div class="ov" id="start">
  <h1>장대 위에서<br><b>버티기</b></h1>
  <p>폰을 쟁반처럼 들고, 천천히 기울여 휘청이는 장대의 균형을 잡고, 날아오는 방해물은 눌러서 터뜨리세요. 오른쪽 위 버튼으로 조작 방향을 바꿀 수 있어요. 시작할 때 폰 각도가 수평 기준이 됩니다.</p>
  <div class="city" role="group" aria-label="도시"><button type="button" data-city="seoul">서울</button><button type="button" data-city="tokyo">도쿄</button></div>
  <button id="go" type="button">시작</button>
  <p style="font-size:12px">화면 회전 잠금을 켜두면 좋아요</p>
</div>
<div class="ov" id="over" hidden>
  <p>버틴 시간</p>
  <div class="big" id="final">0.0</div>
  <p id="rec"></p>
  <p id="popres"></p>
  <div class="city" role="group" aria-label="도시"><button type="button" data-city="seoul">서울</button><button type="button" data-city="tokyo">도쿄</button></div>
  <button id="again" type="button">다시</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const TOP=200;               // 장대 높이
const LIMIT=1;               // 흔들림 한계(1 = 꼭대기가 SWAY만큼 밀림)
const $=id=>document.getElementById(id);

// ---------- 렌더러 / 씬 ----------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050507);
scene.fog=new THREE.FogExp2(0x050507,0.0075);
const camera=new THREE.PerspectiveCamera(68,1,0.1,1000);
camera.up.set(0,0,-1);
const CAM_OFF=new THREE.Vector3(0,8.5,3.2), LOOK_OFF=new THREE.Vector3(0,-6,-1.2);
const camPos=new THREE.Vector3(0,TOP+8.5,3.2), camLook=new THREE.Vector3(0,TOP-6,-1.2);

scene.add(new THREE.HemisphereLight(0xffffff,0x202024,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(4,10,6); scene.add(sun);

// ---------- 도시 (밤) ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function winTex(R,lit,cw,ch,density,dim){
  const cv=document.createElement('canvas'); cv.width=64; cv.height=256;
  const g=cv.getContext('2d'); g.fillStyle='#121218'; g.fillRect(0,0,64,256);
  for(let y=3;y<256;y+=ch+3) for(let x=3;x<64;x+=cw+3){
    const r=R(); if(r<density){g.fillStyle=r<density*.45?lit:dim;g.fillRect(x,y,cw,ch);}
  }
  const t=new THREE.CanvasTexture(cv); t.magFilter=THREE.NearestFilter; return t;
}
const cityGroup=new THREE.Group(); scene.add(cityGroup);
let cityAnim=[]; // 매 프레임 움직이는 것들
function instBoxes(list,mats,geo){
  const im=new THREE.InstancedMesh(geo||new THREE.BoxGeometry(1,1,1),mats,list.length);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),p=new THREE.Vector3(),sc=new THREE.Vector3(),e=new THREE.Euler();
  list.forEach((b,i)=>{e.set(0,b.ry||0,0);q.setFromEuler(e);p.set(b.x,(b.y||0)+b.h/2,b.z);sc.set(b.w,b.h,b.d);m4.compose(p,q,sc);im.setMatrixAt(i,m4);});
  cityGroup.add(im); return im;
}
function dots(list,color,size,transparent){
  const mat=new THREE.MeshBasicMaterial({color,transparent:!!transparent,fog:true});
  const im=new THREE.InstancedMesh(new THREE.SphereGeometry(size,6,4),mat,Math.max(1,list.length));
  const m4=new THREE.Matrix4(); list.forEach((p,i)=>{m4.makeTranslation(p.x,p.y,p.z);im.setMatrixAt(i,m4);});
  im.count=list.length; cityGroup.add(im); return im;
}
function plane(w,d,x,z,y,color,ry){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({color}));
  m.rotation.set(-Math.PI/2,0,ry||0); m.position.set(x,y,z); cityGroup.add(m); return m;
}
function blinker(list){ const im=dots(list,0xff2a2a,.7,true); cityAnim.push(t=>{im.material.opacity=Math.sin(t*2.6)>.55?1:.12;}); }
function traffic(lines){
  // lines: {x0,z0,x1,z1,y,n,col,speed}
  for(const L of lines){
    const len=Math.hypot(L.x1-L.x0,L.z1-L.z0), off=[];
    const R=rng(L.n*7+len|0); for(let i=0;i<L.n;i++) off.push(R());
    const im=dots(off.map(()=>({x:0,y:0,z:0})),L.col,.45);
    const m4=new THREE.Matrix4();
    cityAnim.push(t=>{ for(let i=0;i<L.n;i++){ const u=((off[i]+t*L.speed/len)%1+1)%1;
      m4.makeTranslation(L.x0+(L.x1-L.x0)*u,L.y,L.z0+(L.z1-L.z0)*u); im.setMatrixAt(i,m4);} im.instanceMatrix.needsUpdate=true; });
  }
}
function clearCity(){
  cityGroup.traverse(o=>{ if(o.geometry)o.geometry.dispose(); });
  while(cityGroup.children.length) cityGroup.remove(cityGroup.children[0]);
  cityAnim=[];
}
function nearPole(x,z,r){return Math.hypot(x,z)<r}

function buildSeoul(){
  const R=rng(20261025);
  scene.background.set(0x05070c); scene.fog.color.set(0x05070c);
  plane(900,900,0,0,0,0x0a0b10);
  // 한강: z 26~66
  const RZ0=26,RZ1=66, inRiver=z=>z>RZ0-6&&z<RZ1+6;
  plane(900,RZ1-RZ0,0,(RZ0+RZ1)/2,.3,0x070a12);
  // 강변북로·올림픽대로 차량 불빛
  traffic([{x0:-200,z0:RZ0-3,x1:200,z1:RZ0-3,y:1,n:70,col:0xfff1d6,speed:14},{x0:200,z0:RZ0-5,x1:-200,z1:RZ0-5,y:1,n:70,col:0xff3b30,speed:14},
           {x0:-200,z0:RZ1+3,x1:200,z1:RZ1+3,y:1,n:70,col:0xff3b30,speed:16},{x0:200,z0:RZ1+5,x1:-200,z1:RZ1+5,y:1,n:70,col:0xfff1d6,speed:16}]);
  // 다리
  const bridges=[-115,-55,10,75,135], bl=[];
  for(const bx of bridges){
    instBoxes([{x:bx,z:(RZ0+RZ1)/2,w:6,d:RZ1-RZ0+10,h:1.2,y:6}],new THREE.MeshBasicMaterial({color:0x2a2b33}));
    for(let z=RZ0-4;z<=RZ1+4;z+=2.5){bl.push({x:bx-3.2,y:8,z},{x:bx+3.2,y:8,z});}
    traffic([{x0:bx-1.2,z0:RZ0-8,x1:bx-1.2,z1:RZ1+8,y:7.8,n:6,col:0xfff1d6,speed:12},{x0:bx+1.2,z0:RZ1+8,x1:bx+1.2,z1:RZ0-8,y:7.8,n:6,col:0xff3b30,speed:12}]);
  }
  dots(bl,0xfff6e5,.35);
  // 남산 + N서울타워
  const NX=-40,NZ=-90;
  const hill=new THREE.Mesh(new THREE.SphereGeometry(1,24,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshBasicMaterial({color:0x0b100d}));
  hill.scale.set(42,48,36); hill.position.set(NX,0,NZ); cityGroup.add(hill);
  const ty=48;
  const tw=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.6,38,10),new THREE.MeshBasicMaterial({color:0xd8dce6})); tw.position.set(NX,ty+19,NZ); cityGroup.add(tw);
  const pod=new THREE.Mesh(new THREE.CylinderGeometry(3.6,3.2,5,16),new THREE.MeshBasicMaterial({color:0xffffff})); pod.position.set(NX,ty+33,NZ); cityGroup.add(pod);
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,16,6),new THREE.MeshBasicMaterial({color:0xaab0bd})); ant.position.set(NX,ty+44,NZ); cityGroup.add(ant);
  blinker([{x:NX,y:ty+52,z:NZ}]);
  const onHill=(x,z)=>((x-NX)/48)**2+((z-NZ)/42)**2<1;
  // 롯데월드타워 (강 건너)
  const LX=45,LZ=112;
  const lt=new THREE.Mesh(new THREE.CylinderGeometry(1,10,178,4,1),new THREE.MeshBasicMaterial({map:winTex(rng(3),'#eef2ff',2,1,.5,'rgba(220,228,255,.35)')}));
  lt.material.map.repeat.set(3,20); lt.material.map.wrapS=lt.material.map.wrapT=THREE.RepeatWrapping;
  lt.rotation.y=Math.PI/4; lt.position.set(LX,89,LZ); cityGroup.add(lt);
  blinker([{x:LX,y:179,z:LZ}]);
  // 아파트 단지: 같은 높이 판상형이 줄지어
  const aptTex=winTex(rng(5),'#ffe2b0',5,3,.85,'rgba(255,214,160,.45)');
  const aptMat=new THREE.MeshBasicMaterial({map:aptTex}), roof=new THREE.MeshBasicMaterial({color:0x22232a});
  const apts=[], others=[], used=[];
  const free=(x,z,r)=>!inRiver(z)&&!nearPole(x,z,r+8)&&!onHill(x,z)&&Math.hypot(x-LX,z-LZ)>r+12&&used.every(u=>Math.hypot(u.x-x,u.z-z)>u.r+r);
  for(let c=0;c<70;c++){
    const cx=(R()-.5)*320, cz=(R()-.5)*320, rows=3+(R()*3|0), cols=2+(R()*2|0);
    const rad=Math.max(rows*9,cols*16);
    if(!free(cx,cz,rad)) continue; used.push({x:cx,z:cz,r:rad});
    const ang=(R()-.5)*.5, h=38+R()*42;
    for(let r=0;r<rows;r++) for(let k=0;k<cols;k++){
      const lx=(k-(cols-1)/2)*30, lz=(r-(rows-1)/2)*17;
      apts.push({x:cx+lx*Math.cos(ang)+lz*Math.sin(ang), z:cz-lx*Math.sin(ang)+lz*Math.cos(ang), w:24, d:5.5, h:h+(R()-.5)*4, ry:ang});
    }
  }
  instBoxes(apts,[aptMat,aptMat,roof,roof,aptMat,aptMat]);
  // 상가·업무 빌딩
  const offTex=winTex(rng(7),'#f2f5ff',4,4,.55,'rgba(230,236,255,.4)');
  const offMat=new THREE.MeshBasicMaterial({map:offTex});
  const crosses=[], av=[];
  for(let i=0;i<900&&others.length<380;i++){
    const x=(R()-.5)*320, z=(R()-.5)*320, w=5+R()*9, d=5+R()*9;
    if(!free(x,z,Math.max(w,d)*.7)) continue; used.push({x,z,r:Math.max(w,d)*.6});
    const center=Math.hypot(x,z)<70, h=center&&R()<.5?60+R()*95:10+R()*30;
    others.push({x,z,w,d,h});
    if(h<34&&R()<.12) crosses.push({x,z,y:h});
    if(h>85) av.push({x,y:h+.8,z});
  }
  instBoxes(others,[offMat,offMat,roof,roof,offMat,offMat]);
  // 빨간 십자가
  const cmat=new THREE.MeshBasicMaterial({color:0xff2b2b});
  instBoxes(crosses.map(c=>({x:c.x,z:c.z,y:c.y,w:.9,h:8,d:.9})),cmat);
  instBoxes(crosses.map(c=>({x:c.x,z:c.z,y:c.y+4.2,w:5,h:.9,d:.9})),cmat);
  blinker(av);
}

function buildTokyo(){
  const R=rng(19580101);
  scene.background.set(0x07060a); scene.fog.color.set(0x07060a);
  plane(900,900,0,0,0,0x0b0a0e);
  // 스미다강: 구불구불 세로로
  const rx=z=>70+Math.sin(z/45)*22, inRiver=(x,z)=>Math.abs(x-rx(z))<16;
  for(let z=-220;z<220;z+=8){ plane(24,9,rx(z),z,.3,0x08090f,-Math.atan(Math.cos(z/45)*22/45)); }
  // 고가 순환 전철
  const LR=92;
  const ring=new THREE.Mesh(new THREE.TorusGeometry(LR,.9,4,160),new THREE.MeshBasicMaterial({color:0x2c2c34}));
  ring.rotation.x=Math.PI/2; ring.position.y=11; cityGroup.add(ring);
  const pil=[]; for(let a=0;a<Math.PI*2;a+=Math.PI/40) pil.push({x:Math.cos(a)*LR,z:Math.sin(a)*LR,w:1,d:1,h:11});
  instBoxes(pil,new THREE.MeshBasicMaterial({color:0x1c1c22}));
  const carMat=new THREE.MeshBasicMaterial({color:0xd9ffe8}), cars=60;
  const trains=new THREE.InstancedMesh(new THREE.BoxGeometry(2.2,2.2,5.6),carMat,cars); cityGroup.add(trains);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),p=new THREE.Vector3(),sc=new THREE.Vector3(1,1,1),e=new THREE.Euler();
  cityAnim.push(t=>{ for(let i=0;i<cars;i++){ const tr=i/10|0, k=i%10;
      const a=(tr*Math.PI/3)+t*.06*(tr%2?1:-1)+(k*6.2/LR)*(tr%2?-1:1);
      p.set(Math.cos(a)*(LR+(tr%2?1.4:-1.4)),13,Math.sin(a)*(LR+(tr%2?1.4:-1.4))); e.set(0,-a,0); q.setFromEuler(e);
      m4.compose(p,q,sc); trains.setMatrixAt(i,m4);} trains.instanceMatrix.needsUpdate=true; });
  // 도쿄타워
  const TX=-28,TZ=78;
  const tt=new THREE.Mesh(new THREE.ConeGeometry(11,135,4,6,true),new THREE.MeshBasicMaterial({color:0xff6a1a,wireframe:true}));
  tt.position.set(TX,67.5,TZ); tt.rotation.y=Math.PI/4; cityGroup.add(tt);
  const tc=new THREE.Mesh(new THREE.ConeGeometry(10,128,4),new THREE.MeshBasicMaterial({color:0xb8430c,transparent:true,opacity:.55}));
  tc.position.set(TX,64,TZ); tc.rotation.y=Math.PI/4; cityGroup.add(tc);
  for(const [y,s] of [[40,8],[78,4.6]]){const dk=new THREE.Mesh(new THREE.BoxGeometry(s,2.4,s),new THREE.MeshBasicMaterial({color:0xfff0dc}));dk.position.set(TX,y,TZ);cityGroup.add(dk);}
  blinker([{x:TX,y:136,z:TZ}]);
  // 스카이트리
  const SX=48,SZ=-118;
  const sk=new THREE.Mesh(new THREE.CylinderGeometry(1.2,6,192,12),new THREE.MeshBasicMaterial({color:0x9fb4d8,transparent:true,opacity:.8}));
  sk.position.set(SX,96,SZ); cityGroup.add(sk);
  for(const [y,r] of [[115,5],[160,3.4]]){const rg=new THREE.Mesh(new THREE.CylinderGeometry(r,r,3,20),new THREE.MeshBasicMaterial({color:0xeaf6ff}));rg.position.set(SX,y,SZ);cityGroup.add(rg);}
  blinker([{x:SX,y:193,z:SZ}]);
  // 빽빽한 건물들, 길이 제각각이라 살짝씩 틀어짐
  const t1=winTex(rng(9),'#f4f7ff',3,2,.6,'rgba(220,240,255,.4)'), t2=winTex(rng(13),'#fff0d8',3,3,.5,'rgba(255,230,200,.35)');
  const m1=new THREE.MeshBasicMaterial({map:t1}), m2=new THREE.MeshBasicMaterial({map:t2}), roof=new THREE.MeshBasicMaterial({color:0x26242c});
  const A=[],B=[],av=[],used=[];
  const free=(x,z,r)=>!inRiver(x,z)&&!nearPole(x,z,r+7)&&Math.abs(Math.hypot(x,z)-LR)>r+3&&Math.hypot(x-TX,z-TZ)>r+12&&Math.hypot(x-SX,z-SZ)>r+8&&used.every(u=>Math.hypot(u.x-x,u.z-z)>u.r+r);
  for(let i=0;i<4000&&(A.length+B.length)<820;i++){
    const x=(R()-.5)*330, z=(R()-.5)*330, w=3.5+R()*7, d=3.5+R()*7, r=Math.max(w,d)*.55;
    if(!free(x,z,r)) continue; used.push({x,z,r});
    const shin=Math.hypot(x+60,z+40)<45, h=shin?55+R()*100:(R()<.08?35+R()*40:6+R()*24);
    (R()<.6?A:B).push({x,z,w,d,h,ry:(R()-.5)*.35});
    if(h>75) av.push({x,y:h+.8,z});
  }
  instBoxes(A,[m1,m1,roof,roof,m1,m1]); instBoxes(B,[m2,m2,roof,roof,m2,m2]);
  // 간판 불빛 (주황 한 색)
  const signs=[]; for(const b of B) if(b.h<30&&R()<.18) signs.push({x:b.x+b.w*.5,z:b.z,y:b.h*.4,w:.4,h:b.h*.5,d:1.4});
  instBoxes(signs,new THREE.MeshBasicMaterial({color:0xff7a2a}));
  blinker(av);
}
let cityName='seoul'; try{cityName=localStorage.getItem('pole-city')||'seoul'}catch(e){}
function buildCity(){ clearCity(); (cityName==='tokyo'?buildTokyo:buildSeoul)();
  document.querySelectorAll('.city button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.city===cityName)); }

buildCity();


// 장대
function stoneTex(){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
  const g=cv.getContext('2d'); g.fillStyle='#8e8e94'; g.fillRect(0,0,128,128);
  g.strokeStyle='#6c6c72'; g.lineWidth=3;
  for(let y=0;y<128;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(128,y);g.stroke();
    const o=(y/32)%2?32:0; for(let x=o;x<128;x+=64){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+32);g.stroke();}}
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const st=stoneTex(); st.repeat.set(1,2);
// 휘는 장대: 마디를 쌓아 곡선으로 휨
const SEG=40, SL=TOP/SEG, SWAY=16;  // SWAY: 한계에서 꼭대기가 옆으로 밀리는 거리
const stoneMat=new THREE.MeshLambertMaterial({map:st});
const segs=[];
for(let k=0;k<SEG;k++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.8,SL*1.02,1.8),stoneMat);
  scene.add(m); segs.push(m);
}
const top=new THREE.Vector3(0,TOP,0), tilt={x:0,z:0};
function bendPole(sx,sz){
  // 꼭대기 변위 D, 모양 x(y)=D*(y/L)^2
  const Dx=sx*SWAY, Dz=sz*SWAY;
  for(let k=0;k<SEG;k++){
    const u=(k+.5)/SEG, y=u*TOP;
    const m=segs[k];
    m.position.set(Dx*u*u,y,Dz*u*u);
    const slx=2*Dx*u/TOP, slz=2*Dz*u/TOP;
    m.rotation.set(Math.atan(slz),0,-Math.atan(slx));
  }
  top.set(Dx,TOP+SL*.5,Dz);
  tilt.x=Math.atan(2*Dx/TOP); tilt.z=Math.atan(2*Dz/TOP);
}

// 사람 (앉은 자세, 엉덩이 = 회전축)
const red=new THREE.MeshStandardMaterial({color:0xd8181f,roughness:.25,metalness:.1,emissive:0x300000});
const man=new THREE.Group(); scene.add(man);
const body=new THREE.Group(); man.add(body);
function cyl(r,h){return new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,h,10),red);}
for(const sx of [-1,1]){
  const thigh=cyl(.12,.55); thigh.rotation.x=Math.PI/2; thigh.rotation.z=sx*.35; thigh.position.set(.2*sx,.12,-.25); body.add(thigh);
  const shin=cyl(.1,.5); shin.position.set(.32*sx,-.1,-.5); shin.rotation.z=sx*.2; body.add(shin);
}
const torso=cyl(.24,.7); torso.position.set(0,.45,0); torso.rotation.x=-.25; body.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),red); head.position.set(0,.98,-.14); body.add(head);
function arm(side){
  const p=new THREE.Group(); p.position.set(.27*side,.72,-.08);
  const a=cyl(.07,.7); a.position.y=-.35; p.add(a); body.add(p); return p;
}
const armL=arm(-1), armR=arm(1);

// ---------- 효과 캔버스 (바람 줄) ----------
const fx=$('fx'), g2=fx.getContext('2d');
let streaks=[];

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  fx.width=w*devicePixelRatio; fx.height=h*devicePixelRatio; g2.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize',resize); resize();

// ---------- 방해물 ----------
const obGeo=new THREE.OctahedronGeometry(.45,0);
const obMat=new THREE.MeshStandardMaterial({color:0xf4f4f6,roughness:.4,emissive:0x555560});
const bitGeo=new THREE.TetrahedronGeometry(.14,0);
let obs=[], bits=[], popped=0, obNext=0;
function spawnOb(){
  const a=Math.random()*Math.PI*2, R=16;
  const m=new THREE.Mesh(obGeo,obMat);
  m.position.set(top.x+Math.cos(a)*R, top.y+1+Math.random()*2.5, top.z+Math.sin(a)*R);
  const sp=2.6+Math.random()*1.8+Math.min(t,120)*.012;
  obs.push({m,sp,spin:new THREE.Vector3(Math.random(),Math.random(),Math.random())});
  scene.add(m);
}
function burst(p,n,col){
  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true});
  for(let k=0;k<n;k++){
    const b=new THREE.Mesh(bitGeo,mat); b.position.copy(p);
    const v=new THREE.Vector3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(3+Math.random()*4);
    scene.add(b); bits.push({b,v,life:1});
  }
}
function clearObs(){ for(const o of obs) scene.remove(o.m); obs=[]; }
function updateObs(dt){
  if(state==='play'&&t>15){
    obNext-=dt;
    if(obNext<=0){ spawnOb(); obNext=Math.max(1.4,4.5-t*.012)+Math.random()*2.5; }
  }
  const aim=new THREE.Vector3();
  for(let k=obs.length-1;k>=0;k--){
    const o=obs[k];
    aim.set(man.position.x,man.position.y+.6,man.position.z).sub(o.m.position);
    const d=aim.length();
    o.m.position.addScaledVector(aim.normalize(),o.sp*dt);
    o.m.rotation.x+=o.spin.x*dt*3; o.m.rotation.y+=o.spin.y*dt*3;
    if(d<.8&&state==='play'){
      // 맞으면 날아온 방향으로 크게 밀림
      om.x+=aim.x*.55; om.z+=aim.z*.55;
      burst(o.m.position,10,0xd8181f); scene.remove(o.m); obs.splice(k,1);
    }
  }
  for(let k=bits.length-1;k>=0;k--){
    const p=bits[k]; p.life-=dt*1.6; p.v.y-=6*dt;
    p.b.position.addScaledVector(p.v,dt); p.b.material.opacity=Math.max(0,p.life);
    if(p.life<=0){scene.remove(p.b);bits.splice(k,1);}
  }
}
function tapOb(x,y){
  // 화면 터치 위치와 가장 가까운 방해물 (넉넉한 판정)
  let best=null,bd=56;
  const v=new THREE.Vector3();
  for(const o of obs){
    v.copy(o.m.position).project(camera);
    const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight;
    const d=Math.hypot(sx-x,sy-y); if(d<bd){bd=d;best=o;}
  }
  if(!best) return false;
  burst(best.m.position,14,0xf4f4f6); scene.remove(best.m); obs.splice(obs.indexOf(best),1);
  popped++; $('pop').textContent=popped?'터뜨림 '+popped:'';
  return true;
}

// ---------- 입력 ----------
let ori=null, base=null, gotOri=false;
let dir='fwd'; try{dir=localStorage.getItem('pole-dir')||'fwd'}catch(e){}
function showDir(){$('dir').textContent=dir==='fwd'?'순방향 · 기울인 쪽으로':'역방향 · 기울인 반대쪽으로';}
$('dir').addEventListener('pointerdown',e=>e.stopPropagation());
$('dir').onclick=()=>{dir=dir==='fwd'?'rev':'fwd';try{localStorage.setItem('pole-dir',dir)}catch(e){}showDir();};
showDir();
let touchStart=null, touchVec={x:0,y:0};
const keys={};
addEventListener('deviceorientation',e=>{
  if(e.beta==null) return; ori={b:e.beta,g:e.gamma}; gotOri=true;
});
addEventListener('pointerdown',e=>{if(state!=='play')return;if(tapOb(e.clientX,e.clientY))return;touchStart={x:e.clientX,y:e.clientY};});
addEventListener('pointermove',e=>{if(!touchStart)return;touchVec={x:e.clientX-touchStart.x,y:e.clientY-touchStart.y};});
addEventListener('pointerup',()=>{touchStart=null;touchVec={x:0,y:0};});
addEventListener('pointercancel',()=>{touchStart=null;touchVec={x:0,y:0};});
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);

const MAXT=0.55; // 최대 기울기 입력(rad)
function readTilt(){
  // 반환: 쟁반 기울기 φ (x: 오른쪽 내려감 +, z: 화면 아래쪽 내려감 +)
  if(gotOri&&ori&&base){
    let gx=(ori.g-base.g), bz=(ori.b-base.b);
    const d=Math.PI/180;
    const sg=dir==='fwd'?1:-1;
    return {x:clamp(sg*gx*d,-MAXT,MAXT), z:clamp(sg*bz*d,-MAXT,MAXT)};
  }
  let x=0,z=0;
  if(touchStart){x=touchVec.x/110*MAXT; z=touchVec.y/110*MAXT;}
  if(keys.ArrowLeft)x-=MAXT*.7; if(keys.ArrowRight)x+=MAXT*.7;
  if(keys.ArrowUp)z-=MAXT*.7; if(keys.ArrowDown)z+=MAXT*.7;
  return {x:clamp(x,-MAXT,MAXT), z:clamp(z,-MAXT,MAXT)};
}
function clamp(v,a,b){return v<a?a:v>b?b:v}

// ---------- 게임 상태 ----------
let state='ready', t=0, th={x:0,z:0}, om={x:0,z:0};
let wind={x:0,z:0,left:0,next:3}, fall=null, wake=null;
let best=0; try{best=+localStorage.getItem('pole-best')||0}catch(e){}
$('best').textContent='최고 '+best.toFixed(1)+'초';

async function begin(){
  $('start').hidden=true; $('over').hidden=true;
  $('start').style.display='none'; $('over').style.display='none';
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)
        await DeviceOrientationEvent.requestPermission(); }catch(e){}
  try{ wake=await navigator.wakeLock.request('screen'); }catch(e){}
  setTimeout(()=>{ base=ori?{...ori}:null;
    $('mode').textContent=gotOri?'기울기 조작':'기울기 센서 없음 · 손가락 드래그로 조작';
  },250);
  reset(); state='play';
}
function reset(){
  clearObs(); popped=0; obNext=0; $('pop').textContent='';
  t=0; th={x:(Math.random()-.5)*.04,z:(Math.random()-.5)*.04}; om={x:0,z:0};
  wind={x:0,z:0,w:0,left:0,next:Math.random()*2}; fall=null; streaks=[];
  bendPole(th.x,th.z); placeMan(); camPos.copy(top).add(CAM_OFF); camLook.copy(top).add(LOOK_OFF);
}
document.querySelectorAll('.city button').forEach(b=>b.onclick=()=>{cityName=b.dataset.city;try{localStorage.setItem('pole-city',cityName)}catch(e){}buildCity();});
$('go').onclick=begin; $('again').onclick=begin;

function gameOver(){
  state='fall'; clearObs();
  const d=Math.hypot(th.x,th.z)||1;
  fall={vx:th.x/d*4+om.x*SWAY*.5,vz:th.z/d*4+om.z*SWAY*.5,vy:1,ry:0,time:0};
}
function showResult(){
  state='over'; $('over').style.display='';
  const isBest=t>best; if(isBest){best=t;try{localStorage.setItem('pole-best',best)}catch(e){}}
  $('final').textContent=t.toFixed(1);
  $('popres').textContent=popped?'방해물 '+popped+'개 터뜨림':'';
  $('rec').textContent=isBest?'새 기록':'최고 '+best.toFixed(1)+'초';
  $('best').textContent='최고 '+best.toFixed(1)+'초';
  $('over').hidden=false;
}

// ---------- 루프 ----------
let last=performance.now();
function step(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  if(state==='play') physics(dt);
  else if(state==='fall') falling(dt);
  else idle(now/1000);
  updateObs(dt);
  const ct=now/1000; for(const f of cityAnim) f(ct);
  draw(dt);
  requestAnimationFrame(step);
}
function physics(dt){
  t+=dt;
  const k=.45+Math.min(t,120)*.0013;           // 휘청이는 힘, 아주 천천히 강해짐 (최대 .6)
  const c=2.6, damp=.55;                        // 최대 기울이면 한계에서도 항상 되돌릴 수 있음
  const jit=.06+Math.min(t,120)*.0008;         // 대신 잔흔들림이 늘어남
  const phi=readTilt();
  // 바람: 10초 이후, 세기·길이 랜덤
  let wx=0,wz=0;
  if(t>10){
    wind.next-=dt;
    if(wind.next<=0&&wind.left<=0){
      const a=Math.random()*Math.PI*2, w=.1+Math.random()*.35;
      wind={x:Math.cos(a)*w,z:Math.sin(a)*w,w,left:1+Math.random()*4,next:0};
    }
    if(wind.left>0){
      wind.left-=dt; wx=wind.x; wz=wind.z;
      if(wind.left<=0) wind.next=3+Math.random()*4;
      if(Math.random()<wind.w*1.6) streaks.push({x:wind.x>0?-40:innerWidth+40,y:Math.random()*innerHeight,dx:Math.sign(wind.x)||1,dy:wind.z/wind.w*.25,l:30+wind.w*200,life:1,a:.15+wind.w});
    }
  }
  for(const a of ['x','z']){
    const acc=k*th[a]*(1+th[a]*th[a]) + c*phi[a] + (a==='x'?wx:wz) + (Math.random()-.5)*jit - damp*om[a];
    om[a]+=acc*dt; th[a]+=om[a]*dt;
  }
  if(Math.hypot(th.x,th.z)>LIMIT) gameOver();
  $('time').textContent=t.toFixed(1);
  bendPole(th.x,th.z); placeMan(); pose(1);
  followCam(dt);
}
function placeMan(){ man.position.copy(top); man.rotation.set(tilt.z,0,-tilt.x); }
function followCam(dt){
  // 카메라가 꼭대기를 늦게 따라가서 휘청임이 화면에 보이게
  const r=Math.min(1,dt*1.2);
  camPos.lerp(top.clone().add(CAM_OFF),r); camLook.lerp(top.clone().add(LOOK_OFF),r);
  camera.position.copy(camPos); camera.lookAt(camLook);
}
function pose(flail){
  const v=Math.hypot(om.x,om.z), lean=Math.hypot(th.x,th.z);
  const sw=Math.sin(performance.now()/160)*Math.min(1,v*2+Math.max(0,lean-.5))*flail;
  // 평소엔 장대를 잡고, 흔들리면 팔을 벌려 중심을 잡음
  const open=Math.min(1.6,lean*1.8);
  armL.rotation.z=-.15-open+sw*.4; armR.rotation.z=.15+open+sw*.4;
  armL.rotation.x=.5-om.z*.3; armR.rotation.x=.5+om.z*.3;
  body.rotation.set(-om.z*.15,0,om.x*.15);
}
function falling(dt){
  fall.time+=dt; fall.vy-=20*dt;
  man.position.x+=fall.vx*dt; man.position.z+=fall.vz*dt; man.position.y+=fall.vy*dt;
  man.rotation.x+=Math.sign(th.z||.01)*dt*2.5; man.rotation.z-=Math.sign(th.x||.01)*dt*2.5;
  armL.rotation.z=-2.4+Math.sin(fall.time*16)*.5; armR.rotation.z=2.4-Math.sin(fall.time*16)*.5;
  // 장대는 천천히 제자리로
  om.x*=.97; om.z*=.97; th.x*=.985; th.z*=.985; bendPole(th.x,th.z);
  const ty=Math.max(man.position.y+9,TOP*.25);
  camera.position.lerp(new THREE.Vector3(man.position.x,ty,man.position.z+3.5),Math.min(1,dt*2.2));
  camera.lookAt(man.position.x,man.position.y-4,man.position.z-1);
  if(fall.time>2.4&&state==='fall') showResult();
}
function idle(s){
  if(state!=='ready') return;
  th.x=Math.sin(s*.5)*.12; th.z=Math.cos(s*.37)*.1; om={x:Math.cos(s*.5)*.06,z:-Math.sin(s*.37)*.04};
  bendPole(th.x,th.z); placeMan(); pose(0); followCam(.016);
}
function draw(){
  renderer.render(scene,camera);
  g2.clearRect(0,0,innerWidth,innerHeight);
  g2.lineWidth=1.5; g2.lineCap='round';
  streaks=streaks.filter(s=>s.life>0);
  for(const s of streaks){
    s.x+=s.dx*18; s.y+=s.dy*18; s.life-=.02;
    g2.strokeStyle='rgba(255,255,255,'+((s.a||.35)*s.life)+')';
    g2.beginPath(); g2.moveTo(s.x,s.y); g2.lineTo(s.x-s.dx*s.l,s.y-s.dy*s.l); g2.stroke();
  }
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&state==='play'){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
});
requestAnimationFrame(step);
})();
</script>

</body></html>
