<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
</head><body>
<title>장대 위에서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Black+Han+Sans&display=swap">
<style>
/* 한 화면 게임: 3D 캔버스 전체 + 위쪽 기록 + 가운데 오버레이 */
:root{
  --bg:#050507; --fg:#f4f4f6; --dim:rgba(244,244,246,.55); --faint:rgba(244,244,246,.18);
  --accent:#e0262b;
  --display:"Black Han Sans","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.hud{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 34px);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#time{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#pop{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:1em}
#best{font-size:12px;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(5,5,7,.55);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov h1{font-family:var(--display);font-weight:400;font-size:44px;margin:0;line-height:1.05;text-wrap:balance}
.ov h1 b{color:var(--accent);font-weight:400}
.ov p{margin:0;color:var(--dim);font-size:14px;line-height:1.6;max-width:28ch}
.big{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
button{font:inherit;font-family:var(--display);font-size:20px;color:var(--bg);background:var(--fg);border:0;
  border-radius:999px;padding:14px 44px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:active{transform:scale(.97)}
.loc{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;color:#d3def5;text-shadow:0 1px 8px rgba(4,8,22,.7)}
.loc .place{display:flex;flex-direction:column;gap:2px}
.loc h2{margin:0;font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:2.4rem;line-height:.9;letter-spacing:.02em;text-transform:uppercase}
.loc .sub{font-size:.78rem;color:rgba(211,222,245,.58);letter-spacing:.06em}
.loc .meter{text-align:right;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.loc .h{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:700;font-size:1.9rem;line-height:.9;color:#ff8a3d}
.loc .h small{font-size:.9rem;margin-left:2px}
.loc .t{font-size:.74rem;color:rgba(211,222,245,.58);letter-spacing:.04em}
#ver{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;pointer-events:none;z-index:5}
#dir{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 82px);z-index:20;font-family:var(--body);font-size:12px;font-weight:600;color:var(--fg);background:rgba(244,244,246,.12);border:1px solid var(--faint);padding:8px 12px}
#mode{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:var(--dim);pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
</style>

<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div class="loc"><div class="place"><h2>Mong Kok</h2><span class="sub">旺角 · 홍콩 · 네이선 로드</span></div><div class="meter"><span class="h">320<small>m</small></span><span class="t">기울기 <span id="tiltv">0.0</span>°</span></div></div>
<div class="hud"><div id="time">0.0</div><div id="best">최고 0.0초</div><div id="pop"></div></div>
<button id="dir" type="button"></button>
<div id="mode"></div>
<div id="ver">v0.18</div>

<div class="ov" id="start">
  <h1>장대 위에서<br><b>버티기</b></h1>
  <p>폰을 쟁반처럼 들고, 천천히 기울여 휘청이는 장대의 균형을 잡고, 날아오는 방해물은 눌러서 터뜨리세요. 기울인 쪽(화면 기준)으로 장대가 휘어요. 오른쪽 위 버튼으로 시점을 바꿀 수 있어요. 시작할 때 폰 각도가 수평 기준이 됩니다.</p>
  <button id="go" type="button">시작</button>
  <p style="font-size:12px">화면 회전 잠금을 켜두면 좋아요</p>
</div>
<div class="ov" id="over" hidden>
  <p>버틴 시간</p>
  <div class="big" id="final">0.0</div>
  <p id="rec"></p>
  <p id="popres"></p>
  <button id="again" type="button">다시</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const TOP=320;               // 장대 높이 (도시 시안과 같은 단위, 화면 표시 320m)
const LIMIT=2.2;             // 흔들림 한계: 2.2 = 꼭대기가 SWAY의 2.2배 밀림 ≈ 10°
const $=id=>document.getElementById(id);

// ---------- 렌더러 / 씬 ----------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
let PR=Math.min(devicePixelRatio,2); renderer.setPixelRatio(PR);
// 폰이 버거워하면(2초 평균 40fps 미만) 해상도를 한 단계씩 낮춤
let pfT=0,pfN=0;
function perf(dt){ pfT+=dt;pfN++; if(pfT>2){ const fps=pfN/pfT; pfT=0;pfN=0; if(fps<40&&PR>1){ PR=Math.max(1,PR-.25); renderer.setPixelRatio(PR); resize(); } } }
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050507);
scene.fog=new THREE.FogExp2(0x050507,0.0075);
const camera=new THREE.PerspectiveCamera(68,1,0.1,1000);
camera.up.set(0,0,-1);
const camPos=new THREE.Vector3(0,TOP+10,0);
// 시점: 1 = 수직으로 내려다봄, 2 = 더 높은 곳에서 대각선으로. 장대 끝은 항상 화면 좌 2/3, 위 2/3
// shift: 소실점을 화면 중앙보다 얼마나 아래로 내릴지(화면 높이 비율)
const VIEWS={1:{pitch:90,yaw:0,shift:.32,dist:9,ms:1,cap:.5,fovP:84,fovL:70},2:{pitch:56,yaw:-28,shift:0,dist:13,ms:1,cap:1,fovP:74,fovL:60}};
let view='2'; try{view=localStorage.getItem('pole-view')||'2'}catch(e){}
const camOffset=new THREE.Vector3(), camQuat=new THREE.Quaternion();
const scrR=new THREE.Vector3(1,0,0), scrD=new THREE.Vector3(0,0,1); // 화면 오른쪽·아래쪽이 땅 위에서 가리키는 방향
let cv=null;
function viewTarget(){
  const v=VIEWS[view], fov=innerWidth/innerHeight<.75?v.fovP:v.fovL;
  return {pitch:v.pitch,yaw:v.yaw,shift:v.shift,dist:v.dist,ms:v.ms,cap:v.cap,fov};   // ms: 캐릭터 크기
}
function applyView(){
  const D=Math.PI/180;
  const w=innerWidth,h=innerHeight,fullH=h*(1+2*cv.shift);
  camera.fov=cv.fov; camera.aspect=w/fullH;
  camera.setViewOffset(w,fullH,0,0,w,h); camera.updateProjectionMatrix();
  camQuat.setFromEuler(new THREE.Euler(-cv.pitch*D,cv.yaw*D,0,'YXZ'));
  const tv=Math.tan(cv.fov*D/2), ny=1-2*(h*2/3)/fullH;
  const ray=new THREE.Vector3(1/3*camera.aspect*tv,ny*tv,-1).applyQuaternion(camQuat).normalize();
  camOffset.copy(ray).multiplyScalar(-cv.dist);
  scrR.set(1,0,0).applyQuaternion(camQuat); scrR.y=0; scrR.normalize();
  scrD.set(0,-1,0).applyQuaternion(camQuat); scrD.y=0; if(scrD.lengthSq()<1e-6) scrD.set(0,0,1); scrD.normalize();
}
cv=viewTarget(); applyView();


// ---------- 도시: 몽콕 (좁은 길, 빽빽한 낡은 고층, 화풍 A 외벽, 네온·차량·가로등) ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(19971), H=TOP, CLEAN=false;
const FOG=0x2a3466; scene.background=new THREE.Color(FOG); scene.fog=new THREE.Fog(FOG,260,820);
  function canvasTex(w,h,draw){
    const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
    return t;
  }

  // ---------- facade textures (one tile = 12 x 18 world units) ----------
  const VARIANTS=[   // 낡은 몽콕 외벽: 바랜 타일·콘크리트 색, 밤이라 어둡게
    {base:'#4f5a6c',dark:'#1a1f2b',mid:'#2b3342',lit:.3},   // 회색 콘크리트
    {base:'#4d6a66',dark:'#18242a',mid:'#2a3b3d',lit:.28},  // 바랜 민트 타일
    {base:'#6e5560',dark:'#241a22',mid:'#3b2c35',lit:.26},  // 바랜 분홍 타일
    {base:'#655c4c',dark:'#221e18',mid:'#383226',lit:.3},   // 베이지
    {base:'#3d4f70',dark:'#141c2c',mid:'#253150',lit:.24},  // 푸른 회색
    {base:'#5f6470',dark:'#1d2028',mid:'#30343e',lit:.32}   // 때 탄 흰색
  ];

  function facadeTex(v){   // 빗물·녹물 얼룩, 형광등 창, 방범창, 창마다 에어컨 실외기, 창밖 빨래
    return canvasTex(128,192,(g,w,h)=>{
      g.fillStyle=v.base;g.fillRect(0,0,w,h);
      for(let i=0;i<500;i++){g.fillStyle=R()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)';g.fillRect(R()*w|0,R()*h|0,2,2)}   // 타일 결
      for(let i=0;i<10;i++){g.fillStyle='rgba(10,8,6,'+(0.08+R()*0.16)+')';g.fillRect(R()*w,R()*h,3+R()*8,30+R()*120)}       // 빗물 때
      const cols=4,rows=6,cw=w/cols,rh=h/rows;
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        const x=c*cw+4,y=r*rh+6,ww=cw-8,hh=rh-14;
        g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x-2,y-2,ww+4,hh+4);
        const p=R(); g.fillStyle=p<v.lit?['#e6fff2','#d2ffd6','#f2fbff','#ffd79a'][(R()*4)|0]:(p<v.lit+.4?v.dark:v.mid);
        g.fillRect(x,y,ww,hh);
        g.fillStyle='rgba(0,0,0,.5)';for(let k=1;k<4;k++)g.fillRect(x+k*ww/4,y,1.5,hh);                   // 방범창
        if(R()<.7){const ax=x+(R()<.5?0:ww-12),ay=y+hh+1;g.fillStyle='#b9bec6';g.fillRect(ax,ay,12,7);g.fillStyle='#5a5f68';g.fillRect(ax+2,ay+2,8,3);
          g.fillStyle='rgba(90,55,25,.35)';g.fillRect(ax+5,ay+7,2,10+R()*30);}                                 // 실외기 + 녹물
        if(R()<.18){const cc=['#d8473a','#3f6fd1','#e8c24a','#f2efe6','#e98fb0'];for(let k=0;k<3;k++){g.fillStyle=cc[(R()*cc.length)|0];g.fillRect(x+2+k*7,y+hh-6,5,8)}}  // 빨래
      }
    });
  }
  const roofTex=canvasTex(64,64,(g,w,h)=>{
    g.fillStyle='#6a8ed2';g.fillRect(0,0,w,h);
    for(let i=0;i<10;i++){const s=4+R()*12;g.fillStyle=R()<.5?'#86a6e2':'#4d6fb3';g.fillRect(R()*(w-s),R()*(h-s),s,s*(0.6+R()))}
    for(let i=0;i<60;i++){g.fillStyle='rgba(10,20,60,.25)';g.fillRect(R()*w,R()*h,1,1)}
    g.strokeStyle='#2c4686';g.lineWidth=4;g.strokeRect(2,2,w-4,h-4);
  });
  roofTex.wrapS=roofTex.wrapT=THREE.ClampToEdgeWrapping;

  const SHADE=[1.0,.56,1,1,.8,.5]; // +x lit, -x dark, roof, floor, +z mid, -z darkest
  const MATS=VARIANTS.map(v=>{
    const t=facadeTex(v);
    return SHADE.map((s,i)=> (i===2||i===3)
      ? new THREE.MeshBasicMaterial({map:roofTex,color:new THREE.Color(v===VARIANTS[4]?1.15:1,v===VARIANTS[4]?.75:1,v===VARIANTS[4]?.6:1)})
      : new THREE.MeshBasicMaterial({map:t,color:new THREE.Color(s,s,s)}));
  });

    const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;const TW=12,TH=18;
    for(let f=0;f<6;f++){

  }

  // ---------- city ----------
  const edgePos=[];

  const tops=[];
  for(let cx=-189;cx<=189;cx+=STEP){
    for(let cz=-531;cz<=207;cz+=STEP){
      if(Math.abs(cx)<15||Math.abs(cz)<10)continue;
      const dist=Math.hypot(cx,cz);
      const w=15.8+R()*1.9,d=15.8+R()*1.9;   // 틈 거의 없이 벽처럼
      const low=false;   // 몽콕: 사방이 고층 벽 (숨막히게)
      let h=dist<90?140+R()*135:110+R()*150;   // 들쭉날쭉

      const x=Math.sign(cx)*(Math.abs(cx)-6.5)+(R()-.5)*.6, z=Math.sign(cz)*(Math.abs(cz)-11.25)+(R()-.5)*.6;   // 길 쪽으로 당겨 붙임
      const vi=R()<.14?5:(R()*5|0);
      const geo=makeBox(w,h,d);
      const m=new THREE.Mesh(geo,MATS[vi]);m.position.set(x,0,z);city.add(m);
      addEdges(geo,x,0,z);
      tops.push({x,z,h,w,d});
      // rooftop clutter: water tanks, stair huts
      const n=R()<.65?1+(R()*3|0):0;
      for(let i=0;i<n;i++){

        addEdges(cg,ox,h,oz);
      }
      // neon signs on the buildings that face the two roads
      const nearX=Math.abs(cx)<ROAD_X+6+STEP, nearZ=Math.abs(cz)<ROAD_Z+6+STEP;
      if(nearX){
        const face=cx>0?x-w/2:x+w/2, dir=cx>0?-1:1;
        const k=2+(R()*5|0);
        for(let i=0;i<k;i++){const len=3+R()*5;signs.push({x:face+dir*len/2,y:5+R()*45,z:z+(R()-.5)*(d-2),sx:len,sy:2+R()*5,sz:1.1})}
      }

        const k=1+(R()*4|0);
        for(let i=0;i<k;i++){const len=3+R()*4;signs.push({x:x+(R()-.5)*(w-2),y:5+R()*35,z:face+dir*len/2,sx:1.1,sy:2+R()*4,sz:len})}
      }
    }
  }
  const edgeGeo=new THREE.BufferGeometry();
  edgeGeo.setAttribute('position',new THREE.Float32BufferAttribute(edgePos,3));
  city.add(new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0x060c22,transparent:true,opacity:.9})));

  // signs as one instanced mesh
  const SIGNC=['#ff7a33','#ff4d3d','#ffd08a','#ff9a4a','#ffe6c2','#ff5f2e'].map(c=>new THREE.Color(c));

  const tmp=new THREE.Object3D();

  // ground and glowing streets
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshBasicMaterial({color:0x6a2f1e}));
  ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-150);scene.add(ground);
  const roadTex=canvasTex(64,256,(g,w,h)=>{
    const gr=g.createLinearGradient(0,0,w,0);
    gr.addColorStop(0,'#7a2a18');gr.addColorStop(.12,'#c24c22');gr.addColorStop(.2,'#ff8f45');
    gr.addColorStop(.5,'#ffb35a');gr.addColorStop(.8,'#ff8f45');gr.addColorStop(.88,'#c24c22');gr.addColorStop(1,'#7a2a18');
    g.fillStyle=gr;g.fillRect(0,0,w,h);

    for(let i=0;i<120;i++){g.fillStyle='rgba(40,12,6,.7)';const side=R()<.5?.15:.85;g.fillRect(w*side+(R()-.5)*5,R()*h,1.5,1.5)}
  });
  function road(len,width,rotY,cx,cz){
    const t=roadTex.clone();t.needsUpdate=true;t.repeat.set(1,len/70);
    const g=new THREE.PlaneGeometry(width,len);g.rotateX(-Math.PI/2);if(rotY)g.rotateY(rotY);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t}));m.position.set(cx,0.15,cz);scene.add(m);
    const glow=new THREE.Mesh(g.clone(),new THREE.MeshBasicMaterial({color:0xff7a30,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));

  // ================= 완차이: 네온 간판 + 움직이는 트램·2층 버스·빨간 택시 =================
  function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}
  const dark=new THREE.MeshBasicMaterial({color:0x14101a});
  // 면마다 밝기를 미리 다르게: 윗면 밝게, 옆면 어둡게 (조명 계산 없이 입체감)
  function shaded(opts,sideTex){
    const warm=new THREE.Color(1,.74,.48);   // 가로등 주황빛
    const mk=(s,map)=>new THREE.MeshBasicMaterial(Object.assign({},opts,map?{map}:{}, {color:new THREE.Color(opts.color||0xffffff).multiply(warm).multiplyScalar(s*1.15)}));
    return [mk(.82,sideTex),mk(.5,sideTex),mk(1,null),mk(.3,null),mk(.68,sideTex),mk(.45,sideTex)];
  }

  // --- 네온 간판 ---
  // 성격: 0 켜짐 / 1 숨쉬듯 / 2 고장 지직 / 3 글자가 옆으로 흐름 / 4 한 자씩 켜짐 / 5 테두리 전구가 빙빙
  const WORDS=['大押','酒家','藥房','麻雀','茶餐廳','金行','按摩','時裝','電器','旅館','涼茶','燒臘','酒吧','夜總會','冰室','當舖'];
  const LONG=['旺角大減價','金銀珠寶行','夜總會酒吧','海鮮酒家','電器大特賣','皇后大押'];
  const NEON=['#ff0033','#ff00cc','#00ffee','#ffee00','#00ff44','#3355ff','#ff6600','#ff0066'];
  const FONT=px=>`bold ${px}px "PingFang HK","Noto Sans TC","Hiragino Sans","Microsoft JhengHei",serif`;
  function board(W,H,draw){const t=tex(W,H,(g,w,h)=>{g.fillStyle='#050308';g.fillRect(0,0,w,h);draw(g,w,h)});return t;}
  function glowText(g,ch,x,y,col,on){ g.font=FONT(60);g.textAlign='center';g.textBaseline='middle';
    if(on){g.shadowColor=col;g.shadowBlur=22;g.fillStyle=col;g.fillText(ch,x,y);g.shadowBlur=0;g.globalAlpha=.55;g.fillStyle='#fff';g.font=FONT(52);g.fillText(ch,x,y);g.globalAlpha=1;}

  function bulbs(g,w,h,col,phase){ // 테두리 전구: 3개 중 하나씩 켜져서 도는 것처럼
    const pts=[],step=18; for(let x=12;x<w-12;x+=step)pts.push([x,12]); for(let y=12;y<h-12;y+=step)pts.push([w-12,y]);
    for(let x=w-12;x>12;x-=step)pts.push([x,h-12]); for(let y=h-12;y>12;y-=step)pts.push([12,y]);
    pts.forEach(([x,y],i)=>{const on=(i+phase)%3===0;g.beginPath();g.arc(x,y,on?5:3.5,0,Math.PI*2);g.fillStyle=on?'#fff5d0':col;g.shadowColor=col;g.shadowBlur=on?14:0;g.globalAlpha=on?1:.35;g.fill();g.globalAlpha=1;});g.shadowBlur=0;}
  const pos=(n,vertical,w,h,i)=>vertical?[w/2,64+i*64]:[64+i*64,h/2+2];
  function sizeOf(word,vertical){const n=[...word].length;return vertical?[128,64*n+48]:[64*n+48,128];}
  // 상태별 그림을 미리 만들어 두고 바꿔 끼움 (매 프레임 새로 그리지 않음)
  function makeFrames(word,col,vertical,kind){
    const ch=[...word],[W,H]=sizeOf(word,vertical);
    if(kind===4) return ch.map((_,k)=>k).concat([ch.length,ch.length,-1]).map(k=>board(W,H,(g,w,h)=>{boardFrame(g,w,h,col);ch.forEach((c,i)=>{const [x,y]=pos(ch.length,vertical,w,h,i);glowText(g,c,x,y,col,k<0?false:i<=k)})}));
    if(kind===5) return [0,1,2].map(p=>board(W,H,(g,w,h)=>{bulbs(g,w,h,col,p);ch.forEach((c,i)=>{const [x,y]=pos(ch.length,vertical,w,h,i);glowText(g,c,x,y,col,true)})}));
    if(kind===3){ // 흐르는 전광판: 글자 줄을 이어 붙여 반복
      const t=board(W*2,H,(g,w,h)=>{for(let r=0;r<2;r++)ch.forEach((c,i)=>glowText(g,c,r*W+(i+.5)*W/(ch.length+.6),h/2+2,col,true))});
      t.wrapS=THREE.RepeatWrapping;t.repeat.set(.5,1);return [t];}
    return [board(W,H,(g,w,h)=>{boardFrame(g,w,h,col);ch.forEach((c,i)=>{const [x,y]=pos(ch.length,vertical,w,h,i);glowText(g,c,x,y,col,true)})})];
  }
  const NS=[], TEXC={};
  function addSign(x,y,z,word,col,vertical,alongZ,scale,kind){
    if(CLEAN)return;
    if(kind===3)vertical=false;
    const key=word+col+vertical+kind, frames=TEXC[key]||(TEXC[key]=makeFrames(word,col,vertical,kind));
    let map=frames[0]; if(kind===3){map=map.clone();map.needsUpdate=true;}
    const [W,H]=sizeOf(word,vertical), w=W*scale, h=H*scale;
    const face=new THREE.MeshBasicMaterial({map,fog:false});
    const geo=alongZ?new THREE.BoxGeometry(w,h,.5):new THREE.BoxGeometry(.5,h,w);
    const m=new THREE.Mesh(geo,alongZ?[dark,dark,dark,dark,face,face]:[face,face,dark,dark,dark,dark]);m.position.set(x,y,z);city.add(m);
    const gm=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.42,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
    const pad=2*scale/.068;
    const gl=new THREE.Mesh(alongZ?new THREE.BoxGeometry(w+pad,h+pad,1.4):new THREE.BoxGeometry(1.4,h+pad,w+pad),gm);gl.position.copy(m.position);city.add(gl);
    NS.push({face,gm,kind,frames,map,ph:R()*10,sp:.6+R()*1.2,off:0,fi:0,ft:R()});
  }
  function pickKind(){const r=R();return r<.32?0:r<.45?1:r<.53?2:r<.7?3:r<.87?4:5;}
  const BASE=.068;   // 이전보다 80% 크기

      let sc=BASE*(.6+R()*.8); const [W,H]=sizeOf(word,kind===3?false:vertical); if(W*sc>5.8)sc=5.8/W;
      const len=W*sc,hh=H*sc; addSign(x,hh/2+lay(),side*(7-len/2-.2),word,col,vertical,false,sc,kind);
    }
  }
  // 도로를 가로질러 양쪽 건물을 잇는 큰 간판

    if(CLEAN)return;
    const word=LONG[(R()*LONG.length)|0],col=NEON[(R()*NEON.length)|0],kind=R()<.5?5:3;
    const span=alongZ?24:14, h=alongZ?4.2:3.2, W=1024, H=Math.round(1024*h/span), ch=[...word];
    const spaced=(g,w,hh,r=0)=>ch.forEach((c,i)=>glowText(g,c,r*w/(kind===3?2:1)+(i+.5)*(kind===3?w/2:w)/ch.length,hh/2+2,col,true));

    const map=frames[0];

    const m=new THREE.Mesh(geo,alongZ?[dark,dark,dark,dark,face,face]:[face,face,dark,dark,dark,dark]);
    const y=19+R()*4; if(alongZ)m.position.set(0,y,p);else m.position.set(p,y,0);city.add(m);
    const gm=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.42,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});

  }

  for(const z of [-235,-175,-115,-60,45,85]) spanSign(true,z+(R()-.5)*8);
  for(const x of [-120,-70,-30,35,80,130]) spanSign(false,x+(R()-.5)*8);

  // --- 가로등: 도로 전체를 주황빛으로 ---
  const poolTex=tex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,170,70,1)');r.addColorStop(.45,'rgba(255,120,30,.45)');r.addColorStop(1,'rgba(255,90,20,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
  const poolMat=new THREE.MeshBasicMaterial({map:poolTex,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
  const headMat=new THREE.MeshBasicMaterial({color:0xffb04a,fog:false}), postMat=new THREE.MeshBasicMaterial({color:0x151925});

    const pool=new THREE.Mesh(new THREE.PlaneGeometry(22,22),poolMat);pool.rotation.x=-Math.PI/2;pool.position.set(x,.3,z);city.add(pool);
  }
  for(const side of [1,-1]){ for(let z=-320;z<170;z+=20) if(Math.abs(z)>8) lamp(side*10.6,z,true); for(let x=-210;x<210;x+=28) if(Math.abs(x)>12) lamp(x,side*5.5,false); }

  // --- 인도: 걷는 사람들과 우산 ---
  const PED=[], pedCol=[0x101420,0x1c2233,0x2a1f2a,0x3b2a20,0x23303a,0x40404a].map(c=>new THREE.Color(c));
  const umbCol=['#ff2e4d','#ffd400','#21c7ff','#ffffff','#ff7a00','#2a2a38','#7a3cff'].map(c=>new THREE.Color(c));
  function walkers(axis,lo,hi,a0,a1,n){ for(let i=0;i<n;i++){ const u=R(); PED.push({axis,c:lo+(hi-lo)*u,s:a0+(a1-a0)*R(),a0,a1,v:(R()<.5?-1:1)*(.9+R()*.7),umb:R()<.18}); } }
  // 인도 사람들은 나중에 띠 그림(스프라이트)으로

  const UM=PED.filter(p=>p.umb);

  PED.forEach((p,i)=>pedMesh.setColorAt(i,pedCol[i%pedCol.length])); UM.forEach((p,i)=>umbMesh.setColorAt(i,umbCol[(R()*umbCol.length)|0]));
  city.add(pedMesh);city.add(umbMesh);
  const pm=new THREE.Matrix4();
  function updatePeople(dt){
    let j=0;
    PED.forEach((p,i)=>{
      p.s+=p.v*dt; if(p.s>p.a1)p.s=p.a0; if(p.s<p.a0)p.s=p.a1;

  }

  // --- 탈것 ---
  const TRAM_LIVERY=[['#2f8a4e','#f2d04a'],['#c8342b','#f4eee0'],['#2b5fb8','#ffd27a'],['#7a3fa0','#ffffff'],['#e08a1e','#1d2a3a']];
  function tramTex(body,band){return tex(256,128,(g,w,h)=>{g.fillStyle=body;g.fillRect(0,0,w,h);g.fillStyle=band;g.fillRect(0,54,w,18);
    g.fillStyle='#16202e';for(let x=10;x<w-10;x+=26){g.fillRect(x,10,18,32);g.fillRect(x,80,18,32)}g.fillStyle='#f4eee0';g.fillRect(0,0,w,5)});}
  const busTex=tex(256,96,(g,w,h)=>{g.fillStyle='#ece5d2';g.fillRect(0,0,w,h);g.fillStyle='#c23a2a';g.fillRect(0,46,w,8);
    g.fillStyle='#1d2a3a';for(let x=8;x<w-8;x+=30){g.fillRect(x,8,24,30);g.fillRect(x,60,24,26)}});
  const taxiWin=tex(64,32,(g,w,h)=>{g.fillStyle='#c9ccd6';g.fillRect(0,0,w,h);g.fillStyle='#1d2a3a';g.fillRect(6,6,22,20);g.fillRect(36,6,22,20)});
  const lampF=new THREE.MeshBasicMaterial({color:0xffc066,fog:false}), lampB=new THREE.MeshBasicMaterial({color:0xff2a2a,fog:false});
  const beamMat=new THREE.MeshBasicMaterial({map:poolTex,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
  const shadowMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false});

}
function burst(p,n,col){
  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true});
  for(let k=0;k<n;k++){
    const b=new THREE.Mesh(bitGeo,mat); b.position.copy(p);
    const v=new THREE.Vector3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(3+Math.random()*4);
    scene.add(b); bits.push({b,v,life:1});
  }
}
function clearObs(){ for(const o of obs) scene.remove(o.m); obs=[]; }
function updateObs(dt){
  if(state==='play'&&t>15){
    obNext-=dt;
    if(obNext<=0){ spawnOb(); obNext=Math.max(1.4,4.5-t*.012)+Math.random()*2.5; }
  }
  const aim=new THREE.Vector3();
  for(let k=obs.length-1;k>=0;k--){
    const o=obs[k];
    aim.set(man.position.x,man.position.y+1.1,man.position.z).sub(o.m.position);
    const d=aim.length();
    o.m.position.addScaledVector(aim.normalize(),o.sp*dt);
    o.m.rotation.x+=o.spin.x*dt*3; o.m.rotation.y+=o.spin.y*dt*3;
    if(d<1.3&&state==='play'){
      // 맞으면 날아온 방향으로 크게 밀림
      om.x+=aim.x*.55; om.z+=aim.z*.55;
      burst(o.m.position,10,0xd8181f); scene.remove(o.m); obs.splice(k,1);
    }
  }
  for(let k=bits.length-1;k>=0;k--){
    const p=bits[k]; p.life-=dt*1.6; p.v.y-=6*dt;
    p.b.position.addScaledVector(p.v,dt); p.b.material.opacity=Math.max(0,p.life);
    if(p.life<=0){scene.remove(p.b);bits.splice(k,1);}
  }
}
function tapOb(x,y){
  // 화면 터치 위치와 가장 가까운 방해물 (넉넉한 판정)
  let best=null,bd=56;
  const v=new THREE.Vector3();
  for(const o of obs){
    v.copy(o.m.position).project(camera);
    const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight;
    const d=Math.hypot(sx-x,sy-y); if(d<bd){bd=d;best=o;}
  }
  if(!best) return false;
  burst(best.m.position,14,0xf4f4f6); scene.remove(best.m); obs.splice(obs.indexOf(best),1);
  popped++; $('pop').textContent=popped?'터뜨림 '+popped:'';
  return true;
}

// ---------- 입력 ----------
let ori=null, base=null, gotOri=false;
function showView(){$('dir').textContent=view==='1'?'시점 1 · 수직':'시점 2 · 대각선';}
$('dir').addEventListener('pointerdown',e=>e.stopPropagation());
$('dir').onclick=()=>{view=view==='1'?'2':'1';try{localStorage.setItem('pole-view',view)}catch(e){}showView();};
showView();
let touchStart=null, touchVec={x:0,y:0};
const keys={};
addEventListener('deviceorientation',e=>{
  if(e.beta==null) return; ori={b:e.beta,g:e.gamma}; gotOri=true;
});
addEventListener('pointerdown',e=>{if(state!=='play')return;if(tapOb(e.clientX,e.clientY))return;touchStart={x:e.clientX,y:e.clientY};});
addEventListener('pointermove',e=>{if(!touchStart)return;touchVec={x:e.clientX-touchStart.x,y:e.clientY-touchStart.y};});
addEventListener('pointerup',()=>{touchStart=null;touchVec={x:0,y:0};});
addEventListener('pointercancel',()=>{touchStart=null;touchVec={x:0,y:0};});
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);

const MAXT=0.75; // 최대 기울기 입력(rad) — 작은 기울기 반응은 그대로, 끝까지 기울이면 더 세게 되돌림
function readTilt(){
  // 반환: 쟁반 기울기 φ (x: 오른쪽 내려감 +, z: 화면 아래쪽 내려감 +)
  if(gotOri&&ori&&base){
    let gx=(ori.g-base.g), bz=(ori.b-base.b);
    const d=Math.PI/180;
    return {x:clamp(gx*d,-MAXT,MAXT), z:clamp(bz*d,-MAXT,MAXT)};
  }
  let x=0,z=0;
  if(touchStart){x=touchVec.x/110*MAXT; z=touchVec.y/110*MAXT;}
  if(keys.ArrowLeft)x-=MAXT*.7; if(keys.ArrowRight)x+=MAXT*.7;
  if(keys.ArrowUp)z-=MAXT*.7; if(keys.ArrowDown)z+=MAXT*.7;
  return {x:clamp(x,-MAXT,MAXT), z:clamp(z,-MAXT,MAXT)};
}
function clamp(v,a,b){return v<a?a:v>b?b:v}

// ---------- 게임 상태 ----------
let state='ready', t=0, th={x:0,z:0}, om={x:0,z:0};
let wind={x:0,z:0,left:0,next:3}, fall=null, wake=null;
let best=0; try{best=+localStorage.getItem('pole-best')||0}catch(e){}
$('best').textContent='최고 '+best.toFixed(1)+'초';

async function begin(){
  $('start').hidden=true; $('over').hidden=true;
  $('start').style.display='none'; $('over').style.display='none';
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)
        await DeviceOrientationEvent.requestPermission(); }catch(e){}
  try{ wake=await navigator.wakeLock.request('screen'); }catch(e){}
  setTimeout(()=>{ base=ori?{...ori}:null;
    $('mode').textContent=gotOri?'기울기 조작':'기울기 센서 없음 · 손가락 드래그로 조작';
  },250);
  reset(); state='play';
}
function reset(){
  clearObs(); popped=0; obNext=0; $('pop').textContent='';
  t=0; th={x:(Math.random()-.5)*.04,z:(Math.random()-.5)*.04}; om={x:0,z:0};
  wind={x:0,z:0,w:0,left:0,next:Math.random()*2}; fall=null; streaks=[];
  bendPole(th.x,th.z); placeMan(); camPos.copy(top).add(camOffset);
}
$('go').onclick=begin; $('again').onclick=begin;

function gameOver(){
  state='fall'; clearObs();
  const d=Math.hypot(th.x,th.z)||1;
  fall={vx:th.x/d*4+om.x*SWAY*.5,vz:th.z/d*4+om.z*SWAY*.5,vy:1,ry:0,time:0};
}
function showResult(){
  state='over'; $('over').style.display='';
  const isBest=t>best; if(isBest){best=t;try{localStorage.setItem('pole-best',best)}catch(e){}}
  $('final').textContent=t.toFixed(1);
  $('popres').textContent=popped?'방해물 '+popped+'개 터뜨림':'';
  $('rec').textContent=isBest?'새 기록':'최고 '+best.toFixed(1)+'초';
  $('best').textContent='최고 '+best.toFixed(1)+'초';
  $('over').hidden=false;
}

// ---------- 루프 ----------
let last=performance.now(), tiltT=0;
function step(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  if(state==='play') physics(dt);
  else if(state==='fall') falling(dt);
  else idle(now/1000);
  updateObs(dt);
  const ct=now/1000; updateTraffic(dt); updateSigns(ct,dt); updateCrowd(dt);
  perf(dt);
  tiltT+=dt; if(tiltT>.1){ tiltT=0; $('tiltv').textContent=(Math.hypot(tilt.x,tilt.z)*180/Math.PI).toFixed(1); }
  draw(dt);
  requestAnimationFrame(step);
}
function physics(dt){
  t+=dt;
  const k=.45+Math.min(t,120)*.0013;           // 휘청이는 힘, 아주 천천히 강해짐 (최대 .6)
  const c=3.2, damp=.55;                        // 되돌리는 힘 최대 3.2×.75=2.4 > 10°에서 쓰러지려는 힘 최대 2.1 → 어느 각도든 원복 가능, 떨어지는 건 반동 때문
  const jit=.06+Math.min(t,120)*.0008;         // 대신 잔흔들림이 늘어남
  const phi=readTilt();
  // 바람: 10초 이후, 세기·길이 랜덤
  let wx=0,wz=0;
  if(t>10){
    wind.next-=dt;
    if(wind.next<=0&&wind.left<=0){
      const a=Math.random()*Math.PI*2, w=.1+Math.random()*.35;
      wind={x:Math.cos(a)*w,z:Math.sin(a)*w,w,left:1+Math.random()*4,next:0};
    }
    if(wind.left>0){
      wind.left-=dt; wx=wind.x; wz=wind.z;
      if(wind.left<=0) wind.next=3+Math.random()*4;
      if(Math.random()<wind.w*1.6) streaks.push({x:wind.x>0?-40:innerWidth+40,y:Math.random()*innerHeight,dx:Math.sign(wind.x)||1,dy:wind.z/wind.w*.25,l:30+wind.w*200,life:1,a:.15+wind.w});
    }
  }
  // 조작·바람은 화면 기준 → 땅 위 방향으로 바꿈 (시점이 바뀌어도 기울인 화면 쪽으로 휨)
  const sx=c*phi.x+wx, sz=c*phi.z+wz;
  const f={x:sx*scrR.x+sz*scrD.x, z:sx*scrR.z+sz*scrD.z};
  for(const a of ['x','z']){
    const acc=k*th[a]*(1+.12*th[a]*th[a]) + f[a] + (Math.random()-.5)*jit - damp*om[a];
    om[a]+=acc*dt; th[a]+=om[a]*dt;
  }
  if(Math.hypot(th.x,th.z)>LIMIT) gameOver();
  $('time').textContent=t.toFixed(1);
  bendPole(th.x,th.z); placeMan(); pose(1);
  followCam(dt);
}
function placeMan(){ man.position.copy(top); man.rotation.set(tilt.z,0,-tilt.x); }
const qT=new THREE.Quaternion(), eT=new THREE.Euler(), offR=new THREE.Vector3(), scrP=new THREE.Vector3();
function followCam(dt){
  // 카메라가 꼭대기를 늦게 따라가서 휘청임이 화면에 보이게
  // 시점 전환은 1~2초에 걸쳐 고개를 돌리듯
  const T=viewTarget(), b=Math.min(1,dt*2.2);
  for(const key in T) cv[key]+=(T[key]-cv[key])*b;
  applyView();
  man.scale.setScalar(cv.ms);
  capM.material.color.setHex(0xbfc9e6).multiplyScalar(cv.cap);   // 수직 시점은 상면을 시안처럼 어둡게   // 수직 시점은 시안처럼 캐릭터를 크게(타이트하게)
  // 장대가 기운 만큼 카메라도 같이 기울어서 건물들이 시점째 휘청임 (꼭대기 기준으로 회전)
  eT.set(tilt.z,0,-tilt.x); qT.setFromEuler(eT);
  offR.copy(camOffset).applyQuaternion(qT);
  // 카메라는 꼭대기에 붙어 있어서 캐릭터는 화면에 고정, 도시 전체가 흔들림
  camPos.copy(top).add(offR);
  camera.position.copy(camPos); camera.quaternion.copy(qT).multiply(camQuat);
}
function pose(flail){
  // 흔들리면 몸을 반대로 살짝 기울여 버팀
  body.rotation.set(-om.z*.12,0,om.x*.12);
}
function falling(dt){
  fall.time+=dt; fall.vy-=20*dt;
  man.position.x+=fall.vx*dt; man.position.z+=fall.vz*dt; man.position.y+=fall.vy*dt;
  man.rotation.x+=Math.sign(th.z||.01)*dt*2.5; man.rotation.z-=Math.sign(th.x||.01)*dt*2.5;
  // 장대는 천천히 제자리로
  om.x*=.97; om.z*=.97; th.x*=.985; th.z*=.985; bendPole(th.x,th.z);
  const ty=Math.max(man.position.y+9,TOP*.25);
  camera.position.lerp(new THREE.Vector3(man.position.x,ty,man.position.z+3.5),Math.min(1,dt*2.2));
  camera.lookAt(man.position.x,man.position.y-4,man.position.z-1);
  if(fall.time>2.4&&state==='fall') showResult();
}
function idle(s){
  if(state!=='ready') return;
  th.x=Math.sin(s*.5)*.12; th.z=Math.cos(s*.37)*.1; om={x:Math.cos(s*.5)*.06,z:-Math.sin(s*.37)*.04};
  bendPole(th.x,th.z); placeMan(); pose(0); followCam(.016);
}
function draw(){
  renderer.render(scene,camera);
  g2.clearRect(0,0,innerWidth,innerHeight);
  g2.lineWidth=1.5; g2.lineCap='round';
  streaks=streaks.filter(s=>s.life>0);
  for(const s of streaks){
    s.x+=s.dx*18; s.y+=s.dy*18; s.life-=.02;
    g2.strokeStyle='rgba(255,255,255,'+((s.a||.35)*s.life)+')';
    g2.beginPath(); g2.moveTo(s.x,s.y); g2.lineTo(s.x-s.dx*s.l,s.y-s.dy*s.l); g2.stroke();
  }
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&state==='play'){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
});
requestAnimationFrame(step);
})();
</script>

</body></html>
