<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
</head><body>
<title>장대 위에서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
/* 한 화면 게임: 3D 캔버스 전체 + 위쪽 기록 + 가운데 오버레이 */
:root{
  --bg:#050507; --fg:#f4f4f6; --dim:rgba(244,244,246,.55); --faint:rgba(244,244,246,.18);
  --accent:#e0262b;
  --display:"Black Han Sans","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#time{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#pop{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:1em}
#best{font-size:12px;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(5,5,7,.55);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov h1{font-family:var(--display);font-weight:400;font-size:44px;margin:0;line-height:1.05;text-wrap:balance}
.ov h1 b{color:var(--accent);font-weight:400}
.ov p{margin:0;color:var(--dim);font-size:14px;line-height:1.6;max-width:28ch}
.big{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
button{font:inherit;font-family:var(--display);font-size:20px;color:var(--bg);background:var(--fg);border:0;
  border-radius:999px;padding:14px 44px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:active{transform:scale(.97)}
#ver{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;pointer-events:none;z-index:5}
#dir{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 18px);z-index:20;font-family:var(--body);font-size:12px;font-weight:600;color:var(--fg);background:rgba(244,244,246,.12);border:1px solid var(--faint);padding:8px 12px}
#mode{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:var(--dim);pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
</style>

<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div class="hud"><div id="time">0.0</div><div id="best">최고 0.0초</div><div id="pop"></div></div>
<button id="dir" type="button"></button>
<div id="mode"></div>
<div id="ver">v0.12</div>

<div class="ov" id="start">
  <h1>장대 위에서<br><b>버티기</b></h1>
  <p>폰을 쟁반처럼 들고, 천천히 기울여 휘청이는 장대의 균형을 잡고, 날아오는 방해물은 눌러서 터뜨리세요. 기울인 쪽(화면 기준)으로 장대가 휘어요. 오른쪽 위 버튼으로 시점을 바꿀 수 있어요. 시작할 때 폰 각도가 수평 기준이 됩니다.</p>
  <button id="go" type="button">시작</button>
  <p style="font-size:12px">화면 회전 잠금을 켜두면 좋아요</p>
</div>
<div class="ov" id="over" hidden>
  <p>버틴 시간</p>
  <div class="big" id="final">0.0</div>
  <p id="rec"></p>
  <p id="popres"></p>
  <button id="again" type="button">다시</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const TOP=200;               // 장대 높이
const LIMIT=1;               // 흔들림 한계(1 = 꼭대기가 SWAY만큼 밀림)
const $=id=>document.getElementById(id);

// ---------- 렌더러 / 씬 ----------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050507);
scene.fog=new THREE.FogExp2(0x050507,0.0075);
const camera=new THREE.PerspectiveCamera(68,1,0.1,1000);
camera.up.set(0,0,-1);
const camPos=new THREE.Vector3(0,TOP+10,0);
// 시점: 1 = 수직으로 내려다봄, 2 = 더 높은 곳에서 대각선으로. 장대 끝은 항상 화면 좌 2/3, 위 2/3
// shift: 소실점을 화면 중앙보다 얼마나 아래로 내릴지(화면 높이 비율)
const VIEWS={1:{pitch:90,yaw:0,shift:.32,dist:7.5,fovP:84,fovL:70},2:{pitch:56,yaw:-28,shift:0,dist:12,fovP:74,fovL:60}};
let view='2'; try{view=localStorage.getItem('pole-view')||'2'}catch(e){}
const camOffset=new THREE.Vector3(), camQuat=new THREE.Quaternion();
const scrR=new THREE.Vector3(1,0,0), scrD=new THREE.Vector3(0,0,1); // 화면 오른쪽·아래쪽이 땅 위에서 가리키는 방향
let cv=null;
function viewTarget(){
  const v=VIEWS[view], fov=innerWidth/innerHeight<.75?v.fovP:v.fovL;
  return {pitch:v.pitch,yaw:v.yaw,shift:v.shift,dist:v.dist,fov};
}
function applyView(){
  const D=Math.PI/180;
  const w=innerWidth,h=innerHeight,fullH=h*(1+2*cv.shift);
  camera.fov=cv.fov; camera.aspect=w/fullH;
  camera.setViewOffset(w,fullH,0,0,w,h); camera.updateProjectionMatrix();
  camQuat.setFromEuler(new THREE.Euler(-cv.pitch*D,cv.yaw*D,0,'YXZ'));
  const tv=Math.tan(cv.fov*D/2), ny=1-2*(h*2/3)/fullH;
  const ray=new THREE.Vector3(1/3*camera.aspect*tv,ny*tv,-1).applyQuaternion(camQuat).normalize();
  camOffset.copy(ray).multiplyScalar(-cv.dist);
  scrR.set(1,0,0).applyQuaternion(camQuat); scrR.y=0; scrR.normalize();
  scrD.set(0,-1,0).applyQuaternion(camQuat); scrD.y=0; if(scrD.lengthSq()<1e-6) scrD.set(0,0,1); scrD.normalize();
}
cv=viewTarget(); applyView();

scene.add(new THREE.HemisphereLight(0xffffff,0x202024,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(4,10,6); scene.add(sun);

// ---------- 도시: 몽콕 (파란 고층 + 주황 거리) ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cityGroup=new THREE.Group(); scene.add(cityGroup);
const CITY_H=320;                       // 도시는 높이 320 기준으로 만들고 장대 높이에 맞춰 축소
cityGroup.scale.setScalar(TOP/CITY_H);
function buildMongkok(){
  const R=rng(19971);
  const FOG=0x1b2d63;
  scene.background=new THREE.Color(FOG); scene.fog=new THREE.Fog(FOG,140,470);
  const maxAni=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  function canvasTex(w,h,draw){
    const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=maxAni;return t;
  }
  const VARIANTS=[
    {base:'#3f66b8',dark:'#1c3070',mid:'#2d4c98',lit:.16,line:'rgba(160,185,235,.35)',ac:'#9bb3e4'},
    {base:'#4a72c2',dark:'#203676',mid:'#3456a3',lit:.10,line:'rgba(170,195,240,.32)',ac:'#a7bdea'},
    {base:'#35599f',dark:'#18295f',mid:'#27417f',lit:.22,line:'rgba(140,165,220,.30)',ac:'#8aa2d6'},
    {base:'#5579bf',dark:'#25397a',mid:'#3c5ba6',lit:.08,line:'rgba(180,200,240,.35)',ac:'#b4c6ec'},
    {base:'#c0532c',dark:'#5e2212',mid:'#8a3519',lit:.18,line:'rgba(255,190,150,.30)',ac:'#e9a184'}
  ];
  function facadeTex(v){
    return canvasTex(128,192,(g,w,h)=>{
      g.fillStyle=v.base;g.fillRect(0,0,w,h);
      for(let i=0;i<16;i++){g.fillStyle='rgba(8,16,46,'+(0.05+R()*0.14)+')';g.fillRect(R()*w,R()*h,2+R()*6,24+R()*90)}
      const cols=4,rows=6,cw=w/cols,rh=h/rows;
      for(let r=0;r<rows;r++){
        g.fillStyle=v.line;g.fillRect(0,r*rh,w,2);
        for(let c=0;c<cols;c++){
          const x=c*cw+5,y=r*rh+7,ww=cw-10,hh=rh-15;
          g.fillStyle='rgba(6,12,34,.6)';g.fillRect(x-1.5,y-1.5,ww+3,hh+3);
          const p=R();
          g.fillStyle=p<v.lit?(R()<.5?'#ff8a3d':'#ffbd6b'):(p<v.lit+.4?v.dark:v.mid);
          g.fillRect(x,y,ww,hh);
          if(R()<.4){g.fillStyle=v.ac;g.fillRect(x+ww-9,y+hh+1.5,10,6)}
        }
      }
    });
  }
  const roofTex=canvasTex(64,64,(g,w,h)=>{
    g.fillStyle='#6a8ed2';g.fillRect(0,0,w,h);
    for(let i=0;i<10;i++){const s=4+R()*12;g.fillStyle=R()<.5?'#86a6e2':'#4d6fb3';g.fillRect(R()*(w-s),R()*(h-s),s,s*(0.6+R()))}
    g.strokeStyle='#2c4686';g.lineWidth=4;g.strokeRect(2,2,w-4,h-4);
  });
  roofTex.wrapS=roofTex.wrapT=THREE.ClampToEdgeWrapping;
  const SHADE=[1.0,.56,1,1,.8,.5];
  const MATS=VARIANTS.map((v,vi)=>{
    const t=facadeTex(v), warm=vi===4;
    return SHADE.map((s,i)=>(i===2||i===3)
      ? new THREE.MeshBasicMaterial({map:roofTex,color:new THREE.Color(warm?1.15:1,warm?.75:1,warm?.6:1)})
      : new THREE.MeshBasicMaterial({map:t,color:new THREE.Color(s,s,s)}));
  });
  MATS.push(['#86a5e0','#33508f','#a3bdee','#a3bdee','#6a8bcc','#2b4480'].map(c=>new THREE.MeshBasicMaterial({color:c}))); // 옥상 잡동사니
  const CLUT=MATS.length-1;

  // 건물은 재질·면별로 한 덩어리로 합쳐서 그리기 호출을 줄임
  const buckets={}, edgePos=[];
  function addBox(mi,w,h,d,x,y,z,tile){
    const g=new THREE.BoxGeometry(w,h,d);
    if(tile){const uv=g.attributes.uv;
      for(let f=0;f<6;f++){let su=1,sv=1;if(f<2){su=d/12;sv=h/18}else if(f>=4){su=w/12;sv=h/18}
        for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*su,uv.getY(k)*sv)}}}
    g.translate(x,y+h/2,z);
    const P=g.attributes.position.array,U=g.attributes.uv.array,I=g.index.array;
    for(let f=0;f<6;f++){
      const b=buckets[mi+'_'+f]||(buckets[mi+'_'+f]={mi,f,p:[],u:[]});
      for(let j=0;j<6;j++){const k=I[f*6+j];b.p.push(P[k*3],P[k*3+1],P[k*3+2]);b.u.push(U[k*2],U[k*2+1])}
    }
    const e=new THREE.EdgesGeometry(g),ep=e.attributes.position.array;
    for(let i=0;i<ep.length;i++)edgePos.push(ep[i]);
    e.dispose();g.dispose();
  }
  const signs=[];
  const ROAD_X=17,ROAD_Z=12,STEP=18;
  for(let cx=-189;cx<=189;cx+=STEP){
    for(let cz=-531;cz<=261;cz+=STEP){
      if(Math.abs(cx)<ROAD_X+6||Math.abs(cz)<ROAD_Z+6)continue;
      const dist=Math.hypot(cx,cz);
      const w=11+R()*5,d=11+R()*5;
      let h=dist<90?170+R()*110:(dist<200?120+R()*120:85+R()*110);
      if(R()<.12)h+=40;
      h=Math.min(h,290);
      const x=cx+(R()-.5)*3,z=cz+(R()-.5)*3;
      addBox(R()<.09?4:(R()*4|0),w,h,d,x,0,z,true);
      const n=R()<.65?1+(R()*3|0):0;
      for(let i=0;i<n;i++){
        const cw=1.5+R()*3.5,ch=1.2+R()*3,cd=1.5+R()*3.5;
        addBox(CLUT,cw,ch,cd,x+(R()-.5)*(w-cw),h,z+(R()-.5)*(d-cd),false);
      }
      if(Math.abs(cx)<ROAD_X+6+STEP){
        const face=cx>0?x-w/2:x+w/2,dir=cx>0?-1:1,k=2+(R()*5|0);
        for(let i=0;i<k;i++){const len=3+R()*5;signs.push({x:face+dir*len/2,y:5+R()*45,z:z+(R()-.5)*(d-2),sx:len,sy:2+R()*5,sz:1.1})}
      }
      if(Math.abs(cz)<ROAD_Z+6+STEP){
        const face=cz>0?z-d/2:z+d/2,dir=cz>0?-1:1,k=1+(R()*4|0);
        for(let i=0;i<k;i++){const len=3+R()*4;signs.push({x:x+(R()-.5)*(w-2),y:5+R()*35,z:face+dir*len/2,sx:1.1,sy:2+R()*4,sz:len})}
      }
    }
  }
  for(const key in buckets){
    const b=buckets[key],g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(b.p,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(b.u,2));
    cityGroup.add(new THREE.Mesh(g,MATS[b.mi][b.f]));
  }
  const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(edgePos,3));
  cityGroup.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x060c22,transparent:true,opacity:.9})));

  const SIGNC=['#ff7a33','#ff4d3d','#ffd08a','#ff9a4a','#ffe6c2','#ff5f2e'].map(c=>new THREE.Color(c));
  const sm=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xffffff}),signs.length);
  const o=new THREE.Object3D();
  signs.forEach((s,i)=>{o.position.set(s.x,s.y,s.z);o.scale.set(s.sx,s.sy,s.sz);o.updateMatrix();sm.setMatrixAt(i,o.matrix);sm.setColorAt(i,SIGNC[(R()*SIGNC.length)|0])});
  cityGroup.add(sm);

  const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshBasicMaterial({color:0x6a2f1e}));
  ground.rotation.x=-Math.PI/2;ground.position.z=-150;cityGroup.add(ground);
  const roadTex=canvasTex(64,256,(g,w,h)=>{
    const gr=g.createLinearGradient(0,0,w,0);
    gr.addColorStop(0,'#7a2a18');gr.addColorStop(.12,'#c24c22');gr.addColorStop(.2,'#ff8f45');
    gr.addColorStop(.5,'#ffc074');gr.addColorStop(.8,'#ff8f45');gr.addColorStop(.88,'#c24c22');gr.addColorStop(1,'#7a2a18');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
    g.fillStyle='rgba(255,240,210,.8)';for(let y=0;y<h;y+=32)g.fillRect(w/2-1,y,2,14);
    for(let i=0;i<46;i++){g.fillStyle=R()<.5?'#fff1d0':'#5a1d10';const lane=R()<.5?.33:.62;g.fillRect(w*lane+(R()-.5)*6,R()*h,4,8+R()*5)}
  });
  function road(len,width,rotY,cx,cz){
    const t=roadTex.clone();t.needsUpdate=true;t.repeat.set(1,len/70);
    const g=new THREE.PlaneGeometry(width,len);g.rotateX(-Math.PI/2);if(rotY)g.rotateY(rotY);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t}));m.position.set(cx,.15,cz);cityGroup.add(m);
    const gl=new THREE.Mesh(g.clone(),new THREE.MeshBasicMaterial({color:0xff7a30,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    gl.scale.set(rotY?1:1.6,1,rotY?1.6:1);gl.position.set(cx,4,cz);cityGroup.add(gl);
  }
  road(820,ROAD_X*2+4,0,0,-140);
  road(420,ROAD_Z*2+4,Math.PI/2,0,0);
}
buildMongkok();
const cityAnim=[];


// 장대
function stoneTex(){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
  const g=cv.getContext('2d'); g.fillStyle='#8e8e94'; g.fillRect(0,0,128,128);
  g.strokeStyle='#6c6c72'; g.lineWidth=3;
  for(let y=0;y<128;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(128,y);g.stroke();
    const o=(y/32)%2?32:0; for(let x=o;x<128;x+=64){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+32);g.stroke();}}
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const st=stoneTex(); st.repeat.set(1,2);
// 휘는 장대: 마디를 쌓아 곡선으로 휨
const SEG=40, SL=TOP/SEG, SWAY=16;  // SWAY: 한계에서 꼭대기가 옆으로 밀리는 거리
const stoneMat=new THREE.MeshLambertMaterial({map:st});
const segs=[];
for(let k=0;k<SEG;k++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.8,SL*1.02,1.8),stoneMat);
  scene.add(m); segs.push(m);
}
const top=new THREE.Vector3(0,TOP,0), tilt={x:0,z:0};
function bendPole(sx,sz){
  // 꼭대기 변위 D, 모양 x(y)=D*(y/L)^2
  const Dx=sx*SWAY, Dz=sz*SWAY;
  for(let k=0;k<SEG;k++){
    const u=(k+.5)/SEG, y=u*TOP;
    const m=segs[k];
    m.position.set(Dx*u*u,y,Dz*u*u);
    const slx=2*Dx*u/TOP, slz=2*Dz*u/TOP;
    m.rotation.set(Math.atan(slz),0,-Math.atan(slx));
  }
  top.set(Dx,TOP,Dz);   // 장대 윗면 한가운데 (예전엔 마디 반 개만큼 떠 있었음)
  tilt.x=Math.atan(2*Dx/TOP); tilt.z=Math.atan(2*Dz/TOP);
}

// 사람 (앉은 자세, 엉덩이 = 회전축)
const red=new THREE.MeshBasicMaterial({color:0x05070d,fog:false}); // 검은 실루엣
const man=new THREE.Group(); scene.add(man);
const body=new THREE.Group(); man.add(body);
function cyl(r,h){return new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,h,10),red);}
for(const sx of [-1,1]){
  const thigh=cyl(.12,.55); thigh.rotation.x=Math.PI/2; thigh.rotation.z=sx*.35; thigh.position.set(.2*sx,.12,-.25); body.add(thigh);
  const shin=cyl(.1,.5); shin.position.set(.05*sx,.08,-.52); shin.rotation.set(0,sx*.35,Math.PI/2); body.add(shin); // 책상다리: 정강이를 앞에서 교차
}
const torso=cyl(.24,.7); torso.position.set(0,.45,0); torso.rotation.x=-.25; body.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),red); head.position.set(0,.98,-.14); body.add(head);
function arm(side){
  const p=new THREE.Group(); p.position.set(.27*side,.72,-.08);
  const a=cyl(.07,.7); a.position.y=-.35; p.add(a); body.add(p); return p;
}
const armL=arm(-1), armR=arm(1);

// ---------- 효과 캔버스 (바람 줄) ----------
const fx=$('fx'), g2=fx.getContext('2d');
let streaks=[];

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); cv=viewTarget(); applyView();
  fx.width=w*devicePixelRatio; fx.height=h*devicePixelRatio; g2.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize',resize); resize();

// ---------- 방해물 ----------
const obGeo=new THREE.OctahedronGeometry(.45,0);
const obMat=new THREE.MeshStandardMaterial({color:0xf4f4f6,roughness:.4,emissive:0x555560});
const bitGeo=new THREE.TetrahedronGeometry(.14,0);
let obs=[], bits=[], popped=0, obNext=0;
function spawnOb(){
  // 화면 기준 각도 45°(오른쪽 위)~225°(왼쪽 아래): 오른쪽·아래쪽에서는 안 나옴
  const a=(45+Math.random()*180)*Math.PI/180, R=cv.dist*1.6, ca=Math.cos(a), sa=Math.sin(a);
  const m=new THREE.Mesh(obGeo,obMat);
  m.position.set(top.x+(ca*scrR.x-sa*scrD.x)*R, top.y+1+Math.random()*2.5, top.z+(ca*scrR.z-sa*scrD.z)*R);
  const sp=(2.6+Math.random()*1.8+Math.min(t,120)*.012)*R/16;
  obs.push({m,sp,spin:new THREE.Vector3(Math.random(),Math.random(),Math.random())});
  scene.add(m);
}
function burst(p,n,col){
  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true});
  for(let k=0;k<n;k++){
    const b=new THREE.Mesh(bitGeo,mat); b.position.copy(p);
    const v=new THREE.Vector3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize().multiplyScalar(3+Math.random()*4);
    scene.add(b); bits.push({b,v,life:1});
  }
}
function clearObs(){ for(const o of obs) scene.remove(o.m); obs=[]; }
function updateObs(dt){
  if(state==='play'&&t>15){
    obNext-=dt;
    if(obNext<=0){ spawnOb(); obNext=Math.max(1.4,4.5-t*.012)+Math.random()*2.5; }
  }
  const aim=new THREE.Vector3();
  for(let k=obs.length-1;k>=0;k--){
    const o=obs[k];
    aim.set(man.position.x,man.position.y+.6,man.position.z).sub(o.m.position);
    const d=aim.length();
    o.m.position.addScaledVector(aim.normalize(),o.sp*dt);
    o.m.rotation.x+=o.spin.x*dt*3; o.m.rotation.y+=o.spin.y*dt*3;
    if(d<.8&&state==='play'){
      // 맞으면 날아온 방향으로 크게 밀림
      om.x+=aim.x*.55; om.z+=aim.z*.55;
      burst(o.m.position,10,0xd8181f); scene.remove(o.m); obs.splice(k,1);
    }
  }
  for(let k=bits.length-1;k>=0;k--){
    const p=bits[k]; p.life-=dt*1.6; p.v.y-=6*dt;
    p.b.position.addScaledVector(p.v,dt); p.b.material.opacity=Math.max(0,p.life);
    if(p.life<=0){scene.remove(p.b);bits.splice(k,1);}
  }
}
function tapOb(x,y){
  // 화면 터치 위치와 가장 가까운 방해물 (넉넉한 판정)
  let best=null,bd=56;
  const v=new THREE.Vector3();
  for(const o of obs){
    v.copy(o.m.position).project(camera);
    const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight;
    const d=Math.hypot(sx-x,sy-y); if(d<bd){bd=d;best=o;}
  }
  if(!best) return false;
  burst(best.m.position,14,0xf4f4f6); scene.remove(best.m); obs.splice(obs.indexOf(best),1);
  popped++; $('pop').textContent=popped?'터뜨림 '+popped:'';
  return true;
}

// ---------- 입력 ----------
let ori=null, base=null, gotOri=false;
function showView(){$('dir').textContent=view==='1'?'시점 1 · 수직':'시점 2 · 대각선';}
$('dir').addEventListener('pointerdown',e=>e.stopPropagation());
$('dir').onclick=()=>{view=view==='1'?'2':'1';try{localStorage.setItem('pole-view',view)}catch(e){}showView();};
showView();
let touchStart=null, touchVec={x:0,y:0};
const keys={};
addEventListener('deviceorientation',e=>{
  if(e.beta==null) return; ori={b:e.beta,g:e.gamma}; gotOri=true;
});
addEventListener('pointerdown',e=>{if(state!=='play')return;if(tapOb(e.clientX,e.clientY))return;touchStart={x:e.clientX,y:e.clientY};});
addEventListener('pointermove',e=>{if(!touchStart)return;touchVec={x:e.clientX-touchStart.x,y:e.clientY-touchStart.y};});
addEventListener('pointerup',()=>{touchStart=null;touchVec={x:0,y:0};});
addEventListener('pointercancel',()=>{touchStart=null;touchVec={x:0,y:0};});
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);

const MAXT=0.55; // 최대 기울기 입력(rad)
function readTilt(){
  // 반환: 쟁반 기울기 φ (x: 오른쪽 내려감 +, z: 화면 아래쪽 내려감 +)
  if(gotOri&&ori&&base){
    let gx=(ori.g-base.g), bz=(ori.b-base.b);
    const d=Math.PI/180;
    return {x:clamp(gx*d,-MAXT,MAXT), z:clamp(bz*d,-MAXT,MAXT)};
  }
  let x=0,z=0;
  if(touchStart){x=touchVec.x/110*MAXT; z=touchVec.y/110*MAXT;}
  if(keys.ArrowLeft)x-=MAXT*.7; if(keys.ArrowRight)x+=MAXT*.7;
  if(keys.ArrowUp)z-=MAXT*.7; if(keys.ArrowDown)z+=MAXT*.7;
  return {x:clamp(x,-MAXT,MAXT), z:clamp(z,-MAXT,MAXT)};
}
function clamp(v,a,b){return v<a?a:v>b?b:v}

// ---------- 게임 상태 ----------
let state='ready', t=0, th={x:0,z:0}, om={x:0,z:0};
let wind={x:0,z:0,left:0,next:3}, fall=null, wake=null;
let best=0; try{best=+localStorage.getItem('pole-best')||0}catch(e){}
$('best').textContent='최고 '+best.toFixed(1)+'초';

async function begin(){
  $('start').hidden=true; $('over').hidden=true;
  $('start').style.display='none'; $('over').style.display='none';
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)
        await DeviceOrientationEvent.requestPermission(); }catch(e){}
  try{ wake=await navigator.wakeLock.request('screen'); }catch(e){}
  setTimeout(()=>{ base=ori?{...ori}:null;
    $('mode').textContent=gotOri?'기울기 조작':'기울기 센서 없음 · 손가락 드래그로 조작';
  },250);
  reset(); state='play';
}
function reset(){
  clearObs(); popped=0; obNext=0; $('pop').textContent='';
  t=0; th={x:(Math.random()-.5)*.04,z:(Math.random()-.5)*.04}; om={x:0,z:0};
  wind={x:0,z:0,w:0,left:0,next:Math.random()*2}; fall=null; streaks=[];
  bendPole(th.x,th.z); placeMan(); camPos.copy(top).add(camOffset);
}
$('go').onclick=begin; $('again').onclick=begin;

function gameOver(){
  state='fall'; clearObs();
  const d=Math.hypot(th.x,th.z)||1;
  fall={vx:th.x/d*4+om.x*SWAY*.5,vz:th.z/d*4+om.z*SWAY*.5,vy:1,ry:0,time:0};
}
function showResult(){
  state='over'; $('over').style.display='';
  const isBest=t>best; if(isBest){best=t;try{localStorage.setItem('pole-best',best)}catch(e){}}
  $('final').textContent=t.toFixed(1);
  $('popres').textContent=popped?'방해물 '+popped+'개 터뜨림':'';
  $('rec').textContent=isBest?'새 기록':'최고 '+best.toFixed(1)+'초';
  $('best').textContent='최고 '+best.toFixed(1)+'초';
  $('over').hidden=false;
}

// ---------- 루프 ----------
let last=performance.now();
function step(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  if(state==='play') physics(dt);
  else if(state==='fall') falling(dt);
  else idle(now/1000);
  updateObs(dt);
  draw(dt);
  requestAnimationFrame(step);
}
function physics(dt){
  t+=dt;
  const k=.45+Math.min(t,120)*.0013;           // 휘청이는 힘, 아주 천천히 강해짐 (최대 .6)
  const c=2.6, damp=.55;                        // 최대 기울이면 한계에서도 항상 되돌릴 수 있음
  const jit=.06+Math.min(t,120)*.0008;         // 대신 잔흔들림이 늘어남
  const phi=readTilt();
  // 바람: 10초 이후, 세기·길이 랜덤
  let wx=0,wz=0;
  if(t>10){
    wind.next-=dt;
    if(wind.next<=0&&wind.left<=0){
      const a=Math.random()*Math.PI*2, w=.1+Math.random()*.35;
      wind={x:Math.cos(a)*w,z:Math.sin(a)*w,w,left:1+Math.random()*4,next:0};
    }
    if(wind.left>0){
      wind.left-=dt; wx=wind.x; wz=wind.z;
      if(wind.left<=0) wind.next=3+Math.random()*4;
      if(Math.random()<wind.w*1.6) streaks.push({x:wind.x>0?-40:innerWidth+40,y:Math.random()*innerHeight,dx:Math.sign(wind.x)||1,dy:wind.z/wind.w*.25,l:30+wind.w*200,life:1,a:.15+wind.w});
    }
  }
  // 조작·바람은 화면 기준 → 땅 위 방향으로 바꿈 (시점이 바뀌어도 기울인 화면 쪽으로 휨)
  const sx=c*phi.x+wx, sz=c*phi.z+wz;
  const f={x:sx*scrR.x+sz*scrD.x, z:sx*scrR.z+sz*scrD.z};
  for(const a of ['x','z']){
    const acc=k*th[a]*(1+th[a]*th[a]) + f[a] + (Math.random()-.5)*jit - damp*om[a];
    om[a]+=acc*dt; th[a]+=om[a]*dt;
  }
  if(Math.hypot(th.x,th.z)>LIMIT) gameOver();
  $('time').textContent=t.toFixed(1);
  bendPole(th.x,th.z); placeMan(); pose(1);
  followCam(dt);
}
function placeMan(){ man.position.copy(top); man.rotation.set(tilt.z,0,-tilt.x); }
const qT=new THREE.Quaternion(), eT=new THREE.Euler(), offR=new THREE.Vector3(), scrP=new THREE.Vector3();
function followCam(dt){
  // 카메라가 꼭대기를 늦게 따라가서 휘청임이 화면에 보이게
  // 시점 전환은 1~2초에 걸쳐 고개를 돌리듯
  const T=viewTarget(), b=Math.min(1,dt*2.2);
  for(const key in T) cv[key]+=(T[key]-cv[key])*b;
  applyView();
  // 장대가 기운 만큼 카메라도 같이 기울어서 건물들이 시점째 휘청임 (꼭대기 기준으로 회전)
  eT.set(tilt.z,0,-tilt.x); qT.setFromEuler(eT);
  offR.copy(camOffset).applyQuaternion(qT);
  // 카메라는 꼭대기에 붙어 있어서 캐릭터는 화면에 고정, 도시 전체가 흔들림
  camPos.copy(top).add(offR);
  camera.position.copy(camPos); camera.quaternion.copy(qT).multiply(camQuat);
}
function pose(flail){
  const v=Math.hypot(om.x,om.z), lean=Math.hypot(th.x,th.z);
  const sw=Math.sin(performance.now()/160)*Math.min(1,v*2+Math.max(0,lean-.5))*flail;
  // 평소엔 장대를 잡고, 흔들리면 팔을 벌려 중심을 잡음
  const open=Math.min(1.6,lean*1.8);
  armL.rotation.z=-.15-open+sw*.4; armR.rotation.z=.15+open+sw*.4;
  armL.rotation.x=.5-om.z*.3; armR.rotation.x=.5+om.z*.3;
  body.rotation.set(-om.z*.15,0,om.x*.15);
}
function falling(dt){
  fall.time+=dt; fall.vy-=20*dt;
  man.position.x+=fall.vx*dt; man.position.z+=fall.vz*dt; man.position.y+=fall.vy*dt;
  man.rotation.x+=Math.sign(th.z||.01)*dt*2.5; man.rotation.z-=Math.sign(th.x||.01)*dt*2.5;
  armL.rotation.z=-2.4+Math.sin(fall.time*16)*.5; armR.rotation.z=2.4-Math.sin(fall.time*16)*.5;
  // 장대는 천천히 제자리로
  om.x*=.97; om.z*=.97; th.x*=.985; th.z*=.985; bendPole(th.x,th.z);
  const ty=Math.max(man.position.y+9,TOP*.25);
  camera.position.lerp(new THREE.Vector3(man.position.x,ty,man.position.z+3.5),Math.min(1,dt*2.2));
  camera.lookAt(man.position.x,man.position.y-4,man.position.z-1);
  if(fall.time>2.4&&state==='fall') showResult();
}
function idle(s){
  if(state!=='ready') return;
  th.x=Math.sin(s*.5)*.12; th.z=Math.cos(s*.37)*.1; om={x:Math.cos(s*.5)*.06,z:-Math.sin(s*.37)*.04};
  bendPole(th.x,th.z); placeMan(); pose(0); followCam(.016);
}
function draw(){
  renderer.render(scene,camera);
  g2.clearRect(0,0,innerWidth,innerHeight);
  g2.lineWidth=1.5; g2.lineCap='round';
  streaks=streaks.filter(s=>s.life>0);
  for(const s of streaks){
    s.x+=s.dx*18; s.y+=s.dy*18; s.life-=.02;
    g2.strokeStyle='rgba(255,255,255,'+((s.a||.35)*s.life)+')';
    g2.beginPath(); g2.moveTo(s.x,s.y); g2.lineTo(s.x-s.dx*s.l,s.y-s.dy*s.l); g2.stroke();
  }
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&state==='play'){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
});
requestAnimationFrame(step);
})();
</script>
